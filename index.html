ores ilustrativos.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Valor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Valor das moedas na saída<\/td>\n<td>US$ 880<\/td>\n<\/tr>\n<tr>\n<td>Taxas recebidas<\/td>\n<td>US$ 60<\/td>\n<\/tr>\n<tr>\n<td>Total na saída<\/td>\n<td>US$ 940<\/td>\n<\/tr>\n<tr>\n<td>Se tivesse só guardado as moedas<\/td>\n<td>US$ 920<\/td>\n<\/tr>\n<tr>\n<td>Resultado contra o depósito<\/td>\n<td>−US$ 60<\/td>\n<\/tr>\n<tr>\n<td>Resultado contra só guardar<\/td>\n<td>+US$ 20<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>As taxas fizeram a posição ganhar de só guardar, mas o dinheiro ainda encolheu. É por isso que o diário precisa das duas comparações.<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Liquidez concentrada<\/td>\n<td>Liquidez colocada só numa faixa de preço escolhida<\/td>\n<\/tr>\n<tr>\n<td>DLMM<\/td>\n<td>Formato de liquidez concentrada em bins, usado pela Meteora na Solana<\/td>\n<\/tr>\n<tr>\n<td>Bin<\/td>\n<td>Degrau de preço fixo dentro da faixa<\/td>\n<\/tr>\n<tr>\n<td>Bin ativo<\/td>\n<td>O bin do preço atual, o único que recebe trocas<\/td>\n<\/tr>\n<tr>\n<td>Bin step<\/td>\n<td>Distância entre bins, em pontos-base<\/td>\n<\/tr>\n<tr>\n<td>Ponto-base<\/td>\n<td>Um centésimo de um por cento: 0,01%<\/td>\n<\/tr>\n<tr>\n<td>Moeda de cotação<\/td>\n<td>A moeda contra a qual o token é negociado, como SOL ou um dólar digital<\/td>\n<\/tr>\n<tr>\n<td>Spot, Curve, Bid-Ask<\/td>\n<td>Formatos de distribuição: por igual, no meio, nas pontas<\/td>\n<\/tr>\n<tr>\n<td>Posição de um lado só<\/td>\n<td>Depósito de uma moeda só, com a faixa toda acima ou abaixo do preço<\/td>\n<\/tr>\n<tr>\n<td>Taxa base<\/td>\n<td>Parte fixa da taxa, definida na criação da piscina<\/td>\n<\/tr>\n<tr>\n<td>Taxa variável<\/td>\n<td>Parte da taxa que sobe com a agitação do mercado<\/td>\n<\/tr>\n<tr>\n<td>TVL<\/td>\n<td>Valor total depositado na piscina<\/td>\n<\/tr>\n<tr>\n<td>Rebalancear<\/td>\n<td>Fechar e reabrir a posição em volta do preço atual<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.meteora.ag/core-products/dlmm/what-is-dlmm\">What is DLMM<\/a>: documentação oficial da Meteora sobre bins, bin step, taxas dinâmicas e os formatos Spot, Curve e Bid-Ask (em inglês).<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.uniswap.org/contracts/v2/concepts/protocol-overview/how-uniswap-works\">How Uniswap works<\/a>: a piscina clássica x × y = k, para comparar (em inglês).<\/li>\n<\/ul>\n<p>Este material é educativo e não é recomendação de investimento. Prover liquidez em tokens voláteis pode trazer perdas grandes e rápidas.<\/p>"}, "10": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">A blockchain mostra o que o criador de um token ainda pode fazer, quem tem as unidades e se há por onde sair; o checklist do módulo elimina golpes conhecidos, mas não torna nenhum token seguro. Leia depois dos quatro vídeos do módulo e antes do quiz.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>10.1 O contrato: mint e freeze<\/h3>\n<p>Análise on-chain é olhar os dados abertos da blockchain: como o token foi criado, quem tem as unidades e para onde elas vão. Na Solana, o primeiro lugar é o próprio token, que pode ter duas permissões:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Permissão<\/th>\n<th>Se estiver ativa, quem a tem pode<\/th>\n<th>Esperado em memecoins<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Emissão (mint authority)<\/td>\n<td>Criar unidades novas e vender, derrubando o preço<\/td>\n<td>Desligada<\/td>\n<\/tr>\n<tr>\n<td>Congelamento (freeze authority)<\/td>\n<td>Congelar a sua conta do token: você não vende nem transfere<\/td>\n<td>Desligada<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Em stablecoins e tokens de empresas, as duas costumam ficar ativas por motivos legais, e a confiança passa a ser na empresa. O padrão mais novo de token na Solana tem extensões: algumas úteis, outras que cobram taxa em toda transferência ou movem unidades sem a sua assinatura. Exploradores como o Solscan mostram as permissões; ferramentas como o RugCheck resumem os riscos. Use mais de uma fonte e confira o endereço do contrato.<\/p>\n<h3>10.2 Holders e o dev<\/h3>\n<p>A lista dos maiores holders mostra quem consegue derrubar o preço com uma venda. Muitas ferramentas acendem alerta quando as dez maiores carteiras passam de 15% a 20% do total. Antes de avaliar, tire da conta a piscina de liquidez e os contratos de travamento: não são pessoas.<\/p>\n<p>Uma pessoa pode espalhar unidades em dezenas de carteiras para parecer distribuição saudável. Mapas como o Bubblemaps ligam carteiras que trocaram dinheiro entre si. Olhe também o dev, a carteira criadora: quanto ainda tem, se já vendeu e o que lançou antes. Vinte tokens no mês, todos mortos em horas, dizem muito sobre o próximo.<\/p>\n<h3>10.3 Bundlers e robôs<\/h3>\n<p>Na Solana, várias transações podem entrar juntas no mesmo bloco, num pacote, o bundle. Alguns criadores lançam o token e, no mesmo pacote, compram com dezenas de carteiras. Quando o público chega, boa parte já está com o criador, disfarçada.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Quem<\/th>\n<th>O que faz<\/th>\n<th>Como aparece<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bundlers<\/td>\n<td>Compram no lançamento, no pacote do criador<\/td>\n<td>Muitas compras no bloco do lançamento, valores parecidos, dinheiro da mesma origem<\/td>\n<\/tr>\n<tr>\n<td>Snipers<\/td>\n<td>Robôs que compram nos primeiros segundos e vendem a quem chega atrasado<\/td>\n<td>Compras imediatas seguidas de vendas rápidas<\/td>\n<\/tr>\n<tr>\n<td>Robôs de volume<\/td>\n<td>Compram e vendem sem parar para o token aparecer nas listas<\/td>\n<td>Trocas pequenas e iguais, em intervalos regulares, com holders quase parados<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Movimento alto sem gente nova chegando é movimento falso.<\/p>\n<h3>10.4 Liquidez<\/h3>\n<p>É da piscina que sai o dinheiro quando você vende. Quem cria a piscina recebe um comprovante de liquidez; se retira tudo de uma vez, o preço vai a quase zero: é o rug pull. Comprovante queimado (enviado para endereço sem dono) impede retirar a liquidez inicial; travado, prende até uma data que vale conferir.<\/p>\n<p>Queimado não quer dizer seguro: quem tem muitas unidades ainda pode vender tudo na piscina. Compare a liquidez com o valor de mercado: R$ 10 milhões de valor com R$ 50 mil de liquidez é uma saída estreita, e poucas vendas derrubam muito o preço.<\/p>\n<h2>Na prática: o checklist num token fictício<\/h2>\n<p>O token fictício GATO passa em quatro dos sete itens e falha justamente nos que mostram quem controla as unidades. Resultado: não passa.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Item do checklist<\/th>\n<th>O que o relatório mostra<\/th>\n<th>Passa?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Permissão de emissão desligada<\/td>\n<td>Desligada<\/td>\n<td>Sim<\/td>\n<\/tr>\n<tr>\n<td>Permissão de congelamento desligada<\/td>\n<td>Desligada<\/td>\n<td>Sim<\/td>\n<\/tr>\n<tr>\n<td>Nenhuma extensão estranha<\/td>\n<td>Nenhuma extensão<\/td>\n<td>Sim<\/td>\n<\/tr>\n<tr>\n<td>Concentração de holders razoável<\/td>\n<td>Dez maiores, sem a piscina: 38%<\/td>\n<td>Não<\/td>\n<\/tr>\n<tr>\n<td>Dev sem histórico ruim<\/td>\n<td>14 tokens criados em 30 dias, todos abaixo de 5% do pico<\/td>\n<td>Não<\/td>\n<\/tr>\n<tr>\n<td>Poucos bundlers<\/td>\n<td>22% das unidades compradas no bloco do lançamento<\/td>\n<td>Não<\/td>\n<\/tr>\n<tr>\n<td>Liquidez queimada ou travada, de tamanho compatível<\/td>\n<td>Queimada; R$ 120 mil para R$ 3 milhões de valor de mercado<\/td>\n<td>Sim<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Repare que as permissões e a liquidez queimada passariam numa olhada rápida. O risco está nas carteiras: 38% com dez donos, um dev que repete o padrão e um quinto das unidades combinado no lançamento. Um único \"não\" já pede cautela; três encerram a análise.<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Análise on-chain<\/td>\n<td>Investigação feita com os dados abertos da blockchain<\/td>\n<\/tr>\n<tr>\n<td>Mint authority<\/td>\n<td>Permissão de criar unidades novas do token<\/td>\n<\/tr>\n<tr>\n<td>Freeze authority<\/td>\n<td>Permissão de congelar a conta do token de alguém<\/td>\n<\/tr>\n<tr>\n<td>Extensões<\/td>\n<td>Recursos extras do padrão novo de token na Solana<\/td>\n<\/tr>\n<tr>\n<td>Holders<\/td>\n<td>Carteiras que têm o token<\/td>\n<\/tr>\n<tr>\n<td>Dev<\/td>\n<td>A carteira que criou o token<\/td>\n<\/tr>\n<tr>\n<td>Mapa de carteiras<\/td>\n<td>Ferramenta que mostra grupos de carteiras ligadas<\/td>\n<\/tr>\n<tr>\n<td>Bundle<\/td>\n<td>Pacote de transações que entram juntas no mesmo bloco<\/td>\n<\/tr>\n<tr>\n<td>Bundlers<\/td>\n<td>Carteiras que compram no lançamento, no pacote do criador<\/td>\n<\/tr>\n<tr>\n<td>Snipers<\/td>\n<td>Robôs que compram nos primeiros segundos de um lançamento<\/td>\n<\/tr>\n<tr>\n<td>Robôs de volume<\/td>\n<td>Robôs que fabricam movimento comprando e vendendo sem parar<\/td>\n<\/tr>\n<tr>\n<td>Comprovante de liquidez<\/td>\n<td>Registro que permite retirar a liquidez da piscina<\/td>\n<\/tr>\n<tr>\n<td>Liquidez queimada<\/td>\n<td>Comprovante enviado a um endereço sem dono<\/td>\n<\/tr>\n<tr>\n<td>Rug pull<\/td>\n<td>Retirada da liquidez pelo criador, que derruba o preço<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://solana.com/docs/tokens\">Tokens na Solana<\/a>: a documentação oficial explica a mint authority e a freeze authority de cada token (em inglês).<\/li>\n<\/ul>\n<p>Este material é educativo e não é recomendação de investimento. Passar no checklist não torna um token seguro; só elimina alguns golpes conhecidos.<\/p>"}, "11": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">Memecoins valem só pela atenção, e na curva de lançamento quem entra cedo lucra com o dinheiro de quem entra tarde; a grande maioria vai a quase zero. Leia depois dos quatro vídeos do módulo e antes do quiz.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>11.1 A curva de lançamento<\/h3>\n<p>Memecoins são tokens sem produto, movidos por piada, comunidade e atenção. Os launchpads tornaram a criação quase instantânea; na Solana, o mais conhecido é a pump.fun, onde surgem dezenas de milhares de tokens por dia.<\/p>\n<p>No começo não há piscina. O próprio contrato vende e recompra o token seguindo uma fórmula, a curva de lançamento (bonding curve): cada compra sobe o preço para a próxima, cada venda baixa. Por dentro, ela funciona como a AMM do módulo 6, com reservas virtuais, que existem só na conta e definem o preço de partida e o formato da curva. O efeito: os primeiros lucram com o dinheiro dos últimos.<\/p>\n<h3>11.2 A graduação<\/h3>\n<p>Quando as compras na curva batem a meta da plataforma, o token se gradua: o dinheiro da curva e parte das unidades vão para uma piscina numa corretora descentralizada. Na pump.fun, a piscina fica na PumpSwap. Depois disso, o token negocia como qualquer outro.<\/p>\n<p>Graduar é raro: em 2026, na maior parte do tempo, menos de 5% dos tokens chegaram lá. E não garante nada. Muitos atingem o pico perto da graduação, quando os primeiros usam a liquidez nova para vender. As regras mudam com frequência (meta, taxas, parte do criador, destino da liquidez); leia sempre as regras atuais da plataforma. Hoje o criador costuma receber parte das taxas, o que também atrai quem lança tokens em série só para recolher taxas.<\/p>\n<h3>11.3 Golpes e rug pull<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Golpe<\/th>\n<th>Como funciona<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rug pull<\/td>\n<td>O criador retira a liquidez de uma vez e o preço vai a zero<\/td>\n<\/tr>\n<tr>\n<td>Soft rug<\/td>\n<td>Dev e carteiras ligadas vendem em escada, por dias, anunciando novidades<\/td>\n<\/tr>\n<tr>\n<td>Pump and dump<\/td>\n<td>Grupo compra cedo, combina a divulgação e vende para quem chega<\/td>\n<\/tr>\n<tr>\n<td>Cópia<\/td>\n<td>Token com o mesmo nome e imagem de um sucesso, mas outro endereço<\/td>\n<\/tr>\n<tr>\n<td>Honeypot<\/td>\n<td>Deixa comprar, mas não deixa vender; o gráfico só sobe<\/td>\n<\/tr>\n<tr>\n<td>Falso apoio<\/td>\n<td>Famosos sem confirmação, perfis invadidos, \"oportunidade exclusiva\" no privado<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Muitos canais de dicas são pagos exatamente para fazer o pump. Compre sempre pelo endereço do contrato, conferido em fonte oficial, e nunca pelo nome.<\/p>\n<h3>11.4 Sinais de alerta<\/h3>\n<p>Nenhum sinal sozinho prova golpe, mas vários juntos tornam a perda total muito provável:<\/p>\n<ul>\n<li><strong>No contrato<\/strong>: permissão de emissão ou congelamento ativa, extensões estranhas, endereço diferente do oficial.<\/li>\n<li><strong>Na distribuição<\/strong>: poucas carteiras com muitas unidades, grupos ligados, muitos bundlers, dev com histórico ruim.<\/li>\n<li><strong>No mercado<\/strong>: liquidez pequena perto do valor de mercado, volume sem holders novos, alta vertical em minutos.<\/li>\n<li><strong>Na divulgação<\/strong>: pressa, ganho garantido, contagem regressiva, convites no privado.<\/li>\n<li><strong>Em você<\/strong>: medo de ficar de fora, dinheiro que não pode perder, nenhuma regra de saída.<\/li>\n<\/ul>\n<p>Se mesmo assim participar: valor pequeno que pode ir a zero, saída definida antes, carteira separada e nenhuma assinatura em site desconhecido.<\/p>\n<h2>Na prática: três compradores numa curva<\/h2>\n<p>Nesta simulação, Ana mais que dobra o dinheiro e Carla perde um terço, só por causa da ordem de entrada e saída. A curva usa reservas virtuais de 30 SOL e 1,073 bilhão de unidades, sem taxas. Os três compram nesta ordem e depois vendem tudo na mesma ordem.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Comprador<\/th>\n<th>Entrou com<\/th>\n<th>Unidades recebidas<\/th>\n<th>Saiu com<\/th>\n<th>Resultado<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ana (1ª)<\/td>\n<td>1 SOL<\/td>\n<td>34,6 milhões<\/td>\n<td>2,17 SOL<\/td>\n<td>+117%<\/td>\n<\/tr>\n<tr>\n<td>Beto (2º)<\/td>\n<td>5 SOL<\/td>\n<td>144,2 milhões<\/td>\n<td>7,19 SOL<\/td>\n<td>+44%<\/td>\n<\/tr>\n<tr>\n<td>Carla (3ª)<\/td>\n<td>10 SOL<\/td>\n<td>194,4 milhões<\/td>\n<td>6,64 SOL<\/td>\n<td>−34%<\/td>\n<\/tr>\n<tr>\n<td><strong>Total<\/strong><\/td>\n<td><strong>16 SOL<\/strong><\/td>\n<td><\/td>\n<td><strong>16 SOL<\/strong><\/td>\n<td><strong>0<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Repare na última linha: entraram 16 SOL e saíram 16 SOL. A curva não cria dinheiro; ela só redistribui. O lucro de Ana e Beto é exatamente o prejuízo de Carla. Com taxas, o total que sai seria menor do que o que entrou.<\/p>\n<p>Carla pagou quase o dobro de Ana por unidade, porque cada compra anterior empurrou o preço para cima. É o lugar de quem compra depois que o token \"já está subindo\".<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Memecoin<\/td>\n<td>Token sem produto, movido por piada, comunidade e atenção<\/td>\n<\/tr>\n<tr>\n<td>Launchpad<\/td>\n<td>Plataforma que cria e lança tokens em poucos cliques<\/td>\n<\/tr>\n<tr>\n<td>Curva de lançamento (bonding curve)<\/td>\n<td>Fórmula pela qual o contrato vende e recompra o token antes da piscina<\/td>\n<\/tr>\n<tr>\n<td>Reservas virtuais<\/td>\n<td>Reservas que existem só na conta e definem o preço inicial da curva<\/td>\n<\/tr>\n<tr>\n<td>Graduação<\/td>\n<td>Passagem do token da curva para uma piscina numa corretora descentralizada<\/td>\n<\/tr>\n<tr>\n<td>PumpSwap<\/td>\n<td>Corretora descentralizada da pump.fun, que recebe os tokens graduados<\/td>\n<\/tr>\n<tr>\n<td>Rug pull<\/td>\n<td>Retirada da liquidez pelo criador<\/td>\n<\/tr>\n<tr>\n<td>Soft rug<\/td>\n<td>Venda lenta e em escada do dev e das carteiras ligadas<\/td>\n<\/tr>\n<tr>\n<td>Pump and dump<\/td>\n<td>Alta combinada por um grupo, seguida de venda para quem chega<\/td>\n<\/tr>\n<tr>\n<td>Honeypot<\/td>\n<td>Token que deixa comprar, mas não deixa vender<\/td>\n<\/tr>\n<tr>\n<td>Golpe da cópia<\/td>\n<td>Token falso com o nome e a imagem de outro que fez sucesso<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/pump-fun/pump-public-docs\">Pump public docs<\/a>: repositório público da pump.fun no GitHub, com a documentação técnica da curva e da PumpSwap (em inglês). As regras mudam: confira a versão atual.<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://solana.com/docs/tokens\">Tokens na Solana<\/a>: onde ficam as permissões de emissão e congelamento (em inglês).<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/l14478.htm\">Lei 14.478/2022<\/a>: criou o crime de fraude com ativos virtuais.<\/li>\n<\/ul>\n<p>Este material é educativo e não incentiva apostas. A grande maioria das memecoins vai a quase zero.<\/p>"}, "12": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">O projeto final é uma estratégia completa escrita no papel, sem dinheiro, testada contra um cenário ruim e revisada pelo checklist do curso. Leia depois dos três vídeos do módulo e use como guia para entregar o projeto.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>12.1 A sua estratégia no papel<\/h3>\n<p>O projeto final junta o curso num plano escrito, sem dinheiro. Cada bloco do plano vem de um módulo:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Bloco do plano<\/th>\n<th>Pergunta que ele responde<\/th>\n<th>Módulo de apoio<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Objetivo<\/td>\n<td>Guardar bitcoin por anos, aprender DeFi com pouco ou testar liquidez concentrada?<\/td>\n<td>Todos<\/td>\n<\/tr>\n<tr>\n<td>Tamanho<\/td>\n<td>Quanto do patrimônio vai para cripto, e quanto você aceita perder por operação?<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>Custódia<\/td>\n<td>Onde fica cada parte, e onde está a frase de recuperação?<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>Entrada e saída<\/td>\n<td>O que dispara a entrada, onde ficam o stop e o alvo, e quando você revisa?<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>DeFi e liquidez<\/td>\n<td>Qual piscina, formato, faixa e regra para fechar?<\/td>\n<td>6 e 9<\/td>\n<\/tr>\n<tr>\n<td>Tokens novos<\/td>\n<td>Cada um passou pelo checklist on-chain?<\/td>\n<td>10 e 11<\/td>\n<\/tr>\n<tr>\n<td>Impostos<\/td>\n<td>Como registrar, calcular e declarar cada operação?<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>Simulação<\/td>\n<td>O que teria acontecido num período passado e numa queda de 70%?<\/td>\n<td>5 e 7<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Na simulação, use preços reais de um período passado, inclua as taxas e anote tudo. Depois, repita com uma queda de 70%: o plano precisa aguentar o pior cenário sem mudar a sua vida.<\/p>\n<h3>12.2 A revisão por checklist<\/h3>\n<p>Um plano só vale se aguenta perguntas difíceis. O checklist final, logo abaixo, tem cinco blocos: risco, segurança, regras, análise e registros. Para cada \"não\", ajuste o plano antes de seguir. Revise o plano inteiro a cada três meses, ou quando algo grande mudar na sua vida ou no mercado.<\/p>\n<h3>12.3 Fechando o curso<\/h3>\n<p>Se tiver que guardar só três ideias:<\/p>\n<ol>\n<li>Quem controla a frase de recuperação controla o dinheiro.<\/li>\n<li>O tamanho da posição importa mais que a escolha do token.<\/li>\n<li>Se parece bom demais, provavelmente é golpe.<\/li>\n<\/ol>\n<p>Plataformas, leis e golpes mudam rápido. Volte às fontes oficiais e revise o plano com calma. O certificado sai com os quizzes de todos os módulos e o projeto final concluídos, na área de membros.<\/p>\n<h2>Na prática: um plano preenchido<\/h2>\n<p>O plano de exemplo abaixo aguenta uma queda de 70% com perda de 3,5% do patrimônio. Pessoa fictícia, valores ilustrativos; use como modelo, não como recomendação.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Bloco<\/th>\n<th>Exemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Objetivo<\/td>\n<td>Guardar bitcoin por anos e aprender DeFi com pouco dinheiro<\/td>\n<\/tr>\n<tr>\n<td>Tamanho<\/td>\n<td>Patrimônio de R$ 100.000; reserva de R$ 20.000 fora de cripto; até 5% em cripto (R$ 5.000)<\/td>\n<\/tr>\n<tr>\n<td>Divisão<\/td>\n<td>R$ 4.500 em bitcoin, comprados em parcelas mensais; R$ 500 para aprender DeFi<\/td>\n<\/tr>\n<tr>\n<td>Custódia<\/td>\n<td>Bitcoin na carteira de hardware; frase em placa de metal; DeFi numa carteira quente separada<\/td>\n<\/tr>\n<tr>\n<td>Entrada e saída<\/td>\n<td>Bitcoin: compra mensal fixa, sem stop, revisão trimestral. DeFi: perda máxima de R$ 50 por posição<\/td>\n<\/tr>\n<tr>\n<td>DeFi e liquidez<\/td>\n<td>Piscina Spot de faixa larga num par grande; fechar se o preço ficar fora da faixa por 3 dias<\/td>\n<\/tr>\n<tr>\n<td>Tokens novos<\/td>\n<td>Nenhum neste plano<\/td>\n<\/tr>\n<tr>\n<td>Impostos<\/td>\n<td>Planilha mês a mês com custo, venda e lucro; Bens e Direitos pelo custo de aquisição<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Teste do cenário ruim.<\/strong> Se tudo cair 70%, os R$ 5.000 viram R$ 1.500. A perda de R$ 3.500 é 3,5% do patrimônio, e a reserva continua intacta. O plano passa. Se a mesma conta tocasse a reserva ou as contas do mês, o tamanho estaria errado.<\/p>\n<h2>Checklist final<\/h2>\n<p><strong>Risco<\/strong><\/p>\n<ul>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>A perda máxima por operação está definida.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>O total em cripto pode cair 70% sem mudar a minha vida.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>O dinheiro do aluguel e a reserva estão fora de cripto.<\/span><\/label><\/li>\n<\/ul>\n<p><strong>Segurança<\/strong><\/p>\n<ul>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>A frase de recuperação está fora de qualquer aparelho conectado.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Já testei a recuperação da carteira.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Faço uma transferência de teste antes de valores grandes.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Revogo autorizações de contratos que não uso mais.<\/span><\/label><\/li>\n<\/ul>\n<p><strong>Regras<\/strong><\/p>\n<ul>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Entrada, stop e alvo estão escritos antes de cada operação.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Existe um limite de operações por semana.<\/span><\/label><\/li>\n<\/ul>\n<p><strong>Análise<\/strong><\/p>\n<ul>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Cada token passou pelo checklist on-chain do módulo 10.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Confiro o endereço do contrato numa fonte oficial.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Sei dizer de onde vem o rendimento de cada aplicação.<\/span><\/label><\/li>\n<\/ul>\n<p><strong>Registros<\/strong><\/p>\n<ul>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Tenho um diário com data, motivo, valores e resultado de cada operação.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Os dados para o imposto estão organizados mês a mês.<\/span><\/label><\/li>\n<\/ul>\n<h2>Para ir além<\/h2>\n<p>As fontes oficiais usadas ao longo do curso, para voltar sempre que as regras mudarem:<\/p>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://bitcoin.org/bitcoin.pdf\">Bitcoin: A Peer-to-Peer Electronic Cash System<\/a> (em inglês)<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ethereum.org/pt-br/what-is-ethereum/\">O que é Ethereum?<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ethereum.org/pt-br/security/\">Segurança no Ethereum e prevenção de golpes<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/declaracoes-e-demonstrativos/criptoativos\">Criptoativos — Receita Federal<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/l14478.htm\">Lei 14.478/2022<\/a> e <a target=\"_blank\" rel=\"noopener\" href=\"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/decreto/D11563.htm\">Decreto 11.563/2023<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://conteudo.cvm.gov.br/legislacao/pareceres-orientacao/pare040.html\">Parecer de Orientação CVM 40<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.gov.br/investidor/pt-br/educacional/publicacoes-educacionais/cvm-comportamental/volume-1-vieses-do-investidor.pdf\">Vieses do Investidor<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.meteora.ag/core-products/dlmm/what-is-dlmm\">What is DLMM<\/a> (em inglês)<\/li>\n<\/ul>\n<p>Este material é educativo e não é recomendação de investimento.<\/p>"}, "13": {"titulo": "Ferramentas na prática", "html": "<p class=\"lead\">Este módulo bônus apresenta carteiras e sites que você vai encontrar ao usar cripto de verdade. Nada aqui é recomendação de investimento, e esses aplicativos mudam com frequência: recursos, redes e taxas podem ter mudado desde a gravação. Use os links abaixo, salve nos favoritos e entre sempre por eles.<\/p>\n<h2>Antes de clicar em qualquer link<\/h2>\n<ul>\n<li>Digite o endereço ou use o favorito. Não entre por anúncio, por resultado patrocinado nem por link de grupo.<\/li>\n<li>Sites falsos trocam uma letra (rnetamask no lugar de metamask) ou usam domínios genéricos, como páginas em sites de cursos, blogs gratuitos e hospedagens de teste.<\/li>\n<li>Nenhuma carteira, fabricante ou site de dados pede a sua frase de recuperação. Quem pede é golpe.<\/li>\n<li>Só olhar dados nunca exige conectar a carteira nem assinar nada.<\/li>\n<\/ul>\n<h2>Aula por aula<\/h2>\n<h3>Extra.1 Carteiras de navegador e de celular<\/h3>\n<p>Carteiras quentes guardam as suas chaves num aplicativo ligado à internet. Servem para o dia a dia, com valores menores. O Ethereum e as redes compatíveis com ele (Base, Arbitrum, Polygon e outras) usam o mesmo formato de endereço; a Solana usa outro.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Carteira<\/th>\n<th>Redes principais<\/th>\n<th>Destaque<\/th>\n<th>Site oficial<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MetaMask<\/td>\n<td>Ethereum e redes compatíveis; desde 2025, também Solana<\/td>\n<td>A mais antiga e conhecida do Ethereum<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://metamask.io\">metamask.io<\/a><\/td>\n<\/tr>\n<tr>\n<td>Rabby<\/td>\n<td>Só Ethereum e redes compatíveis<\/td>\n<td>Simula a transação antes de assinar e alerta sobre sites e contratos de risco<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://rabby.io\">rabby.io<\/a><\/td>\n<\/tr>\n<tr>\n<td>Phantom<\/td>\n<td>Solana; também Ethereum, Base, Polygon, Bitcoin e outras<\/td>\n<td>A mais usada na Solana, com troca de tokens embutida<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://phantom.com\">phantom.com<\/a><\/td>\n<\/tr>\n<tr>\n<td>Solflare<\/td>\n<td>Solana<\/td>\n<td>Staking de SOL direto pela carteira; conecta com Ledger<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://solflare.com\">solflare.com<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>No celular, instale pela loja oficial (App Store ou Google Play) e confira o nome do desenvolvedor antes de baixar.<\/p>\n<h3>Extra.2 Carteiras de hardware: Ledger e Trezor<\/h3>\n<p>O aparelho guarda a chave e assina por dentro; o computador só monta a transação. Ele trabalha junto com uma carteira de navegador: ela conecta nos sites, o aparelho assina.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Marca<\/th>\n<th>Linha atual<\/th>\n<th>Ponto de atenção<\/th>\n<th>Aplicativo<\/th>\n<th>Site oficial<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ledger (França)<\/td>\n<td>Nano S Plus, Nano X, Nano Gen5, Flex e Stax<\/td>\n<td>Sistema fechado; serviço opcional e pago de cópia da frase (Ledger Recover)<\/td>\n<td>Ledger Wallet, antes Ledger Live<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.ledger.com\">ledger.com<\/a><\/td>\n<\/tr>\n<tr>\n<td>Trezor (República Tcheca)<\/td>\n<td>Safe 3, Safe 5 e Safe 7<\/td>\n<td>Código aberto, auditável por qualquer pessoa<\/td>\n<td>Trezor Suite<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://trezor.io\">trezor.io<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Compre só na loja oficial ou em revendedor listado no site oficial do fabricante. Usado ou de vendedor desconhecido pode vir adulterado.<\/li>\n<li>Aparelho que chega com frase já anotada é golpe. A frase certa é gerada na primeira configuração, na sua frente.<\/li>\n<li>Em 2025, clientes da Ledger receberam cartas falsas pelo correio pedindo a frase. A Ledger já teve dados de clientes vazados; se puder, receba o aparelho num endereço que não exponha você.<\/li>\n<\/ul>\n<h3>Extra.3 Sites de dados e de análise<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Site<\/th>\n<th>Para que serve<\/th>\n<th>Cuidado<\/th>\n<th>Site oficial<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CoinGecko<\/td>\n<td>Preço, valor de mercado e histórico; independente<\/td>\n<td>Estar listado não é selo de qualidade<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.coingecko.com\">coingecko.com<\/a><\/td>\n<\/tr>\n<tr>\n<td>CoinMarketCap<\/td>\n<td>O mesmo; pertence à Binance desde 2020<\/td>\n<td>Compare com o CoinGecko quando um número parecer estranho<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://coinmarketcap.com\">coinmarketcap.com<\/a><\/td>\n<\/tr>\n<tr>\n<td>DexScreener<\/td>\n<td>Gráfico, liquidez, volume e transações de tokens em corretoras descentralizadas<\/td>\n<td>A lista em alta aceita destaque pago<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://dexscreener.com\">dexscreener.com<\/a><\/td>\n<\/tr>\n<tr>\n<td>GMGN<\/td>\n<td>Terminal de memecoins: tokens recém-criados, holders, carteiras do dev, alertas<\/td>\n<td>Taxa de 1% por operação; carteiras criadas lá dependem da plataforma; alertas são só referência<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://gmgn.ai\">gmgn.ai<\/a><\/td>\n<\/tr>\n<tr>\n<td>Etherscan<\/td>\n<td>Explorador do Ethereum: saldos, transações, contratos<\/td>\n<td>Para consultar, não conecte a carteira<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://etherscan.io\">etherscan.io<\/a><\/td>\n<\/tr>\n<tr>\n<td>Solscan<\/td>\n<td>Explorador da Solana: saldos, transações, permissões de tokens<\/td>\n<td>Para consultar, não conecte a carteira<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://solscan.io\">solscan.io<\/a><\/td>\n<\/tr>\n<tr>\n<td>DefiLlama<\/td>\n<td>TVL por protocolo e por rede, taxas geradas e rendimento das piscinas<\/td>\n<td>Rendimento alto pede a mesma desconfiança dos módulos 6 e 9<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://defillama.com\">defillama.com<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para praticar<\/h2>\n<ul>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Salve nos favoritos o site oficial de cada ferramenta que você pretende usar.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Busque \"metamask\" num buscador e identifique quais resultados são anúncios e qual é o domínio oficial.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>No CoinGecko, abra a página de uma stablecoin e copie o endereço do contrato numa rede.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>Cole esse endereço no Etherscan ou no Solscan, sem conectar carteira, e confira se é o mesmo token.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>No DefiLlama, compare o TVL de duas redes e de dois protocolos que você viu no curso.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\"> <span>No DexScreener ou no GMGN, abra um token recém-criado e aplique o checklist do módulo 10, sem comprar nada.<\/span><\/label><\/li>\n<\/ul>"}}, "quizzes": {"1": [{"pergunta": "Qual problema do escambo o dinheiro resolve?", "opcoes": ["A necessidade de os dois lados quererem, ao mesmo tempo, o que o outro tem", "O excesso de impostos nas trocas", "A dificuldade de transportar mercadorias", "A falta de produtos para trocar"], "correta": 0, "explicacao": "No escambo, a troca só acontece se cada um quiser exatamente o que o outro oferece. O dinheiro é aceito por todos e elimina essa coincidência."}, {"pergunta": "Quais são as três funções do dinheiro?", "opcoes": ["Imprimir, guardar e gastar", "Crédito, débito e Pix", "Meio de troca, unidade de conta e reserva de valor", "Pagar impostos, investir e emprestar"], "correta": 2, "explicacao": "Todo dinheiro serve para pagar, para medir o preço das coisas e para guardar poder de compra para o futuro."}, {"pergunta": "O que aconteceu em 1971?", "opcoes": ["Foi criado o Bitcoin", "O Brasil criou o Real", "Os Estados Unidos acabaram com a troca do dólar por ouro", "Surgiu o primeiro banco central"], "correta": 2, "explicacao": "A partir daí, as moedas passaram a ser fiduciárias: valem pela confiança em quem as emite."}, {"pergunta": "Quando você faz um Pix, o que acontece de fato?", "opcoes": ["O Banco Central imprime dinheiro novo", "A blockchain do Bitcoin registra a operação", "Uma nota física é transportada", "Os bancos ajustam registros de saldo"], "correta": 3, "explicacao": "Dinheiro digital é um registro. O seu banco diminui o seu saldo e o banco de quem recebe aumenta o dele."}, {"pergunta": "O que é o gasto duplo?", "opcoes": ["Pagar duas taxas na mesma transferência", "Gastar a mesma moeda digital duas vezes", "Comprar duas moedas diferentes", "Transferir para dois bancos ao mesmo tempo"], "correta": 1, "explicacao": "Copiar dados digitais é fácil. Sem uma regra, a mesma moeda poderia ser enviada duas vezes."}, {"pergunta": "Como o Bitcoin decide qual de duas transferências conflitantes vale?", "opcoes": ["A que entra primeiro num bloco vale; a outra é rejeitada", "As duas valem pela metade", "O remetente escolhe depois", "O banco escolhe a mais antiga"], "correta": 0, "explicacao": "A ordem dos blocos define o histórico. A segunda tentativa de gastar a mesma moeda é rejeitada."}, {"pergunta": "Se você mudar uma única letra de um texto, o que acontece com o hash SHA-256 dele?", "opcoes": ["Fica mais curto", "Muda só o último caractere", "Continua igual", "Muda por completo, de forma imprevisível"], "correta": 3, "explicacao": "Qualquer mudança mínima gera uma impressão digital totalmente diferente, sempre com 64 caracteres."}, {"pergunta": "O que liga um bloco ao anterior na cadeia?", "opcoes": ["O nome do minerador", "O hash do bloco anterior guardado no cabeçalho", "A data do bloco", "O valor total transferido"], "correta": 1, "explicacao": "Cada bloco carrega o hash do anterior. Alterar um bloco antigo quebra esse elo e todos os seguintes."}, {"pergunta": "Para que serve o nonce na mineração?", "opcoes": ["É o endereço que recebe o prêmio", "É a senha do minerador", "É o número que o minerador muda até achar um hash com os zeros exigidos", "É a taxa paga pela transferência"], "correta": 2, "explicacao": "O minerador testa nonces, um após o outro, até encontrar um hash válido. Não existe atalho."}, {"pergunta": "O que acontece no halving?", "opcoes": ["A recompensa por bloco cai pela metade", "Metade dos mineradores sai da rede", "O preço do bitcoin cai pela metade", "O número máximo de bitcoins dobra"], "correta": 0, "explicacao": "A cada 210 mil blocos, cerca de 4 anos, a emissão por bloco cai à metade. Desde abril de 2024 são 3,125 BTC por bloco. Escassez não é promessa de lucro."}], "2": [{"pergunta": "O que uma carteira de cripto realmente guarda?", "opcoes": ["As chaves que assinam as transferências", "Uma cópia da blockchain", "O saldo em reais", "As moedas"], "correta": 0, "explicacao": "As moedas ficam no livro público. A carteira guarda as chaves que provam quem pode movê-las."}, {"pergunta": "Qual a relação entre chave privada, chave pública e endereço?", "opcoes": ["As três são a mesma coisa", "A chave pública é escolhida pelo usuário", "O endereço gera a chave privada", "A chave privada gera a pública, que gera o endereço; o caminho de volta é impraticável"], "correta": 3, "explicacao": "É um caminho de mão única, como o hash. Por isso você pode mostrar o endereço sem expor a chave."}, {"pergunta": "O que é autocustódia?", "opcoes": ["Usar um seguro da corretora", "Deixar as moedas na corretora", "Guardar você mesmo as chaves, numa carteira que só você controla", "Pedir para um amigo guardar"], "correta": 2, "explicacao": "Ninguém pode bloquear as moedas, mas ninguém recupera o acesso se você perder as chaves."}, {"pergunta": "O que os casos Mt. Gox (2014) e FTX (2022) mostram?", "opcoes": ["Que a autocustódia é perigosa", "O risco de deixar as moedas sob custódia de uma empresa", "Que o Bitcoin pode ser falsificado", "Que corretoras não cobram taxas"], "correta": 1, "explicacao": "Na corretora, você tem uma promessa da empresa. Se ela quebra ou trava os saques, os clientes ficam presos."}, {"pergunta": "Onde guardar a frase de recuperação?", "opcoes": ["No bloco de notas do celular", "Num print salvo na nuvem", "Num e-mail para si mesmo", "Escrita à mão em papel ou gravada em metal, em local seguro"], "correta": 3, "explicacao": "Nada digital: aparelhos são roubados e contas invadidas. Papel ou metal, conferido antes de usar."}, {"pergunta": "O suporte da corretora pede a sua frase de recuperação para resolver um problema. O que fazer?", "opcoes": ["Enviar só metade das palavras", "Não enviar: ninguém legítimo pede a frase", "Enviar por e-mail, que é mais seguro", "Enviar, se o perfil for verificado"], "correta": 1, "explicacao": "Quem tem a frase leva tudo. Nenhum suporte, fabricante ou brinde legítimo pede essas palavras."}, {"pergunta": "Qual a principal vantagem da carteira de hardware?", "opcoes": ["Faz transferências gratuitas", "Rende juros", "A chave é criada e usada dentro do aparelho, sem passar pelo computador", "Dispensa a frase de recuperação"], "correta": 2, "explicacao": "A assinatura acontece dentro do aparelho, e você confere o endereço na telinha dele."}, {"pergunta": "Você comprou uma carteira de hardware e ela veio com uma frase de recuperação já escrita. O que isso indica?", "opcoes": ["Que o aparelho já foi testado", "Que a garantia está ativa", "Facilidade oferecida pelo fabricante", "Golpe: a frase deve ser criada por você ao ligar o aparelho"], "correta": 3, "explicacao": "Quem escreveu a frase tem acesso às moedas. Compre de fonte oficial e crie a frase você mesmo."}, {"pergunta": "Um site promete 1% ao dia garantido com um robô que nunca perde. Isso é sinal de quê?", "opcoes": ["Investimento conservador", "Esquema de pirâmide", "Arbitragem legítima", "Staking"], "correta": 1, "explicacao": "Rendimento garantido e alto é a marca da pirâmide: os primeiros recebem com o dinheiro de quem entra depois."}, {"pergunta": "Por que preferir verificação em duas etapas por aplicativo autenticador, e não por SMS?", "opcoes": ["O número de celular pode ser transferido por golpistas para outro chip", "O aplicativo dispensa senha", "O SMS não funciona no Brasil", "O SMS é mais caro"], "correta": 0, "explicacao": "Com a troca de chip, o golpista recebe seus códigos. O aplicativo fica preso ao seu aparelho."}], "3": [{"pergunta": "Qual o papel da corretora para quem está começando?", "opcoes": ["Garantir lucro", "Guardar a frase de recuperação", "Minerar bitcoins", "Ser a ponte entre o real e as criptomoedas"], "correta": 3, "explicacao": "Você deposita reais, compra a moeda e, se quiser, transfere para a sua carteira."}, {"pergunta": "Por que o Pix de depósito deve sair de uma conta no seu nome?", "opcoes": ["Para pagar menos taxa", "Porque Pix de terceiros costuma ser devolvido ou travado para análise", "Porque é mais rápido", "Não faz diferença"], "correta": 1, "explicacao": "A conta de origem precisa ter o mesmo CPF da conta na corretora, por regras contra fraude e lavagem."}, {"pergunta": "Qual a desvantagem do botão de compra rápida (conversão)?", "opcoes": ["Não aceita Pix", "O preço costuma vir com uma margem embutida", "Demora dias", "Só compra bitcoin"], "correta": 1, "explicacao": "É simples, mas costuma sair mais caro que comprar pelo livro de ofertas."}, {"pergunta": "Você vai receber USDT num endereço que só aceita a rede Ethereum. Qual rede escolher no envio?", "opcoes": ["Ethereum", "Solana", "Tron, porque é mais barata", "Qualquer uma, o USDT é o mesmo"], "correta": 0, "explicacao": "A rede de quem envia tem que ser a mesma aceita por quem recebe. Rede errada pode significar perder o valor."}, {"pergunta": "Endereços de Ethereum começam com:", "opcoes": ["T", "bc1", "0x", "1 ou 3"], "correta": 2, "explicacao": "Endereços de Ethereum começam com 0x e têm 40 caracteres depois disso. bc1, 1 ou 3 são formatos de Bitcoin."}, {"pergunta": "Como conferir um endereço antes de enviar?", "opcoes": ["Pedir confirmação por mensagem", "Digitar à mão com cuidado", "Copiar do histórico de transferências", "Copiar e colar (ou QR code) e conferir o começo e o fim"], "correta": 3, "explicacao": "Nunca digite nem copie do histórico. Conferir as pontas protege contra o golpe do endereço parecido."}, {"pergunta": "No Bitcoin, o que define a taxa de uma transferência?", "opcoes": ["A corretora de destino", "O valor enviado", "O tamanho da transferência em bytes e o movimento da rede", "O horário do dia"], "correta": 2, "explicacao": "Mandar mil ou um milhão de reais pode custar a mesma taxa. Pesa o tamanho dos dados e a demanda por espaço no bloco."}, {"pergunta": "A corretora mostra um memo (tag) junto com o endereço de depósito. O que fazer?", "opcoes": ["Ignorar, é opcional", "Incluir o memo no envio: sem ele, o valor não cai na sua conta", "Usar o memo como senha", "Trocar de rede"], "correta": 1, "explicacao": "Em redes como XRP, Stellar e TON, o memo identifica de quem é o depósito num endereço compartilhado."}, {"pergunta": "Por que fazer uma transferência de teste?", "opcoes": ["Porque transferências não têm volta, e um erro pode custar tudo", "Porque a corretora exige", "Para reduzir a taxa", "Para ganhar bônus"], "correta": 0, "explicacao": "O teste custa uma taxa a mais. O erro, o valor inteiro."}, {"pergunta": "O que são as confirmações de uma transferência?", "opcoes": ["As taxas pagas", "E-mails da corretora", "Os blocos que entraram na cadeia depois do bloco da transferência", "As assinaturas do destinatário"], "correta": 2, "explicacao": "Cada novo bloco torna mais difícil desfazer os anteriores. Por isso as corretoras esperam algumas confirmações."}], "4": [{"pergunta": "O que é um contrato inteligente?", "opcoes": ["Um acordo com a corretora", "Um tipo de carteira", "Um contrato em papel assinado digitalmente", "Um código guardado na blockchain que roda sozinho quando chamado"], "correta": 3, "explicacao": "Como uma máquina de refrigerante: cumpriu a condição, ele executa o que está escrito, sem intermediário."}, {"pergunta": "O que o caso The DAO (2016) ensinou?", "opcoes": ["Que contratos não podem ter erros", "Que o código faz exatamente o que está escrito, inclusive os erros", "Que o Ethereum foi desligado", "Que NFTs são seguros"], "correta": 1, "explicacao": "Uma falha no contrato permitiu desviar cerca de 3,5 milhões de ether. Código público também expõe falhas."}, {"pergunta": "Desde setembro de 2022, como o Ethereum valida os blocos?", "opcoes": ["Prova de participação: validadores travam ether como garantia", "Um banco central valida", "Sorteio entre usuários", "Mineração com placas de vídeo"], "correta": 0, "explicacao": "Quem valida deixa ether travado e perde parte dele se tentar fraudar."}, {"pergunta": "O que é um token?", "opcoes": ["Um registro dentro de um contrato, que diz quanto cada endereço tem", "Uma senha de acesso", "Um minerador", "Uma blockchain nova"], "correta": 0, "explicacao": "A maioria das moedas não tem rede própria: são tokens criados por contratos numa rede existente."}, {"pergunta": "Um token tem nome famoso e logo bonito. O que isso diz sobre ele?", "opcoes": ["Que é seguro", "Que é oficial", "Nada: qualquer pessoa cria um token em minutos", "Que vai valorizar"], "correta": 2, "explicacao": "Existem milhões de tokens, e a imensa maioria não vale nada. Nome e logo não provam nada."}, {"pergunta": "Ter um NFT de uma obra significa:", "opcoes": ["Ter lucro garantido", "Ter os direitos autorais da obra", "Ter o registro público de posse daquele token, com as regras do criador", "Ter a imagem guardada na blockchain"], "correta": 2, "explicacao": "Na maioria das vezes, a imagem fica fora da blockchain, e o NFT não transfere direitos autorais."}, {"pergunta": "Na Ethereum, como se calcula a taxa de uma operação?", "opcoes": ["Uma porcentagem do valor enviado", "O gas gasto vezes o preço do gas", "Um valor fixo por dia", "O valor enviado dividido por mil"], "correta": 1, "explicacao": "Uma transferência simples gasta 21 mil de gas. Com o gas a 2 gwei, custa 42 mil gwei."}, {"pergunta": "Por que transferências pequenas sofrem mais em redes caras?", "opcoes": ["Porque pagam imposto", "Porque a taxa é proporcional ao valor", "Porque a taxa não depende do valor, então pesa mais em valores baixos", "Porque são bloqueadas"], "correta": 2, "explicacao": "Mandar dez ou dez mil reais custa o mesmo gas. Proporcionalmente, o pequeno paga muito mais."}, {"pergunta": "O que aconteceu com o USDC em março de 2023?", "opcoes": ["Passou a valer dois dólares", "Virou stablecoin algorítmica", "Foi extinto", "Perdeu a paridade por alguns dias, porque parte das reservas estava num banco que quebrou"], "correta": 3, "explicacao": "Chegou a cerca de 87 centavos até o governo americano garantir os depósitos do Silicon Valley Bank."}, {"pergunta": "Qual a diferença de risco entre stablecoins com reservas e algorítmicas?", "opcoes": ["As algorítmicas não têm dinheiro guardado e são bem mais arriscadas, como mostrou o UST em 2022", "As com reserva não podem ser congeladas", "As algorítmicas são reguladas pelo Banco Central", "Nenhuma"], "correta": 0, "explicacao": "O UST despencou para quase zero. E, no Brasil, corretoras autorizadas não podem oferecer stablecoins só algorítmicas."}], "5": [{"pergunta": "Um token custa R$ 0,01 e tem 100 bilhões de unidades em circulação. Qual o valor de mercado?", "opcoes": ["R$ 100 milhões", "R$ 1 bilhão", "R$ 10 bilhões", "R$ 0,01"], "correta": 1, "explicacao": "Valor de mercado = preço × unidades em circulação = 0,01 × 100 bilhões = R$ 1 bilhão. Preço baixo não significa barato."}, {"pergunta": "O que é o FDV?", "opcoes": ["O volume de 24 horas", "O valor das unidades já negociadas no dia", "O preço vezes o total de unidades que vão existir um dia", "O lucro do projeto"], "correta": 2, "explicacao": "Valor totalmente diluído: considera também as unidades que ainda vão ser liberadas."}, {"pergunta": "FDV muito maior que o valor de mercado indica:", "opcoes": ["Liquidez alta", "Que o token está barato", "Que muitas unidades ainda vão entrar no mercado e podem pressionar o preço", "Que o projeto acabou"], "correta": 2, "explicacao": "Se a procura não crescer no mesmo ritmo da oferta, o preço tende a sofrer. Vale olhar o cronograma de desbloqueio."}, {"pergunta": "O que a liquidez mede?", "opcoes": ["Quanto dinheiro está disponível para negociar sem mexer muito no preço", "O número de holders", "O lucro dos investidores", "Quanto foi negociado nas últimas 24 horas"], "correta": 0, "explicacao": "Como a mercadoria e o troco de uma banca: quanto mais, mais fácil comprar e vender sem empurrar o preço."}, {"pergunta": "Volume alto com liquidez baixa é sinal de:", "opcoes": ["Token estável", "Mercado saudável", "Mercado parado", "Atenção: muita negociação num mercado raso, onde o preço salta fácil"], "correta": 3, "explicacao": "Muita gente negociando num mercado raso faz o preço oscilar demais."}, {"pergunta": "O que é negociação de fachada?", "opcoes": ["Usar ordem limitada", "Fazer staking", "Comprar na baixa e vender na alta", "Negociar consigo mesmo, entre carteiras do mesmo dono, para inflar o volume"], "correta": 3, "explicacao": "Volume falso faz o mercado parecer mais ativo do que é."}, {"pergunta": "O que é o spread no livro de ofertas?", "opcoes": ["A diferença entre a melhor oferta de venda e a melhor de compra", "O volume do dia", "O preço médio", "A taxa da corretora"], "correta": 0, "explicacao": "Quem compra e vende na hora paga essa diferença. Em mercados rasos, ela é maior."}, {"pergunta": "Por que uma ordem a mercado grande pode sair mais cara que o preço da tela?", "opcoes": ["Porque a corretora cobra multa", "Não pode, o preço é fixo", "Por causa do imposto", "Porque consome várias ofertas do livro, cada uma mais cara: é o deslizamento"], "correta": 3, "explicacao": "Quanto maior a ordem e mais raso o livro, maior o deslizamento (slippage)."}, {"pergunta": "Numa vela (candle) verde, o que aconteceu no período?", "opcoes": ["O preço fechou abaixo da abertura", "O preço fechou acima da abertura", "Não houve negociação", "O volume foi alto"], "correta": 1, "explicacao": "Verde: fechamento acima da abertura. Vermelho: abaixo. Os pavios mostram a máxima e a mínima."}, {"pergunta": "O RSI acima de 70 significa que o preço vai cair?", "opcoes": ["Significa que o token é golpe", "Sim, sempre", "Não: indica muitas altas recentes, mas pode ficar alto por muito tempo em tendências fortes", "Sim, em até 24 horas"], "correta": 2, "explicacao": "Indicadores resumem o passado. Nenhum prevê o futuro."}], "6": [{"pergunta": "Numa corretora automática (AMM), com quem você negocia?", "opcoes": ["Com o minerador", "Com outra pessoa no livro de ofertas", "Com uma piscina de duas moedas, seguindo uma fórmula", "Com o banco"], "correta": 2, "explicacao": "Você coloca uma moeda na piscina e tira a outra. O preço sai da regra x × y = k."}, {"pergunta": "Uma piscina tem 10 ether e 20.000 dólares digitais. Qual o preço do ether nela?", "opcoes": ["US$ 20.000", "US$ 10", "US$ 200", "US$ 2.000"], "correta": 3, "explicacao": "Preço = 20.000 ÷ 10 = US$ 2.000 por ether."}, {"pergunta": "Por que a piscina nunca se esvazia?", "opcoes": ["Porque as taxas cobrem", "Porque tem limite de compra", "Porque quanto mais uma moeda sai, mais cara ela fica", "Porque o protocolo repõe"], "correta": 2, "explicacao": "A fórmula x × y = k faz o preço subir sem limite à medida que uma moeda acaba."}, {"pergunta": "O que são os arbitradores numa AMM?", "opcoes": ["Robôs que roubam", "Os criadores do token", "Juízes de disputas", "Quem compra onde está barato e vende onde está caro, aproximando o preço da piscina do mercado"], "correta": 3, "explicacao": "Eles mantêm o preço da piscina perto do resto do mercado."}, {"pergunta": "Para que serve a tolerância de deslizamento?", "opcoes": ["Para pagar menos taxa", "Para definir o quanto você aceita receber a menos que o mostrado; se piorar além disso, a troca é cancelada", "Para acelerar a troca", "Para escolher a rede"], "correta": 1, "explicacao": "Ela protege contra mudanças de preço. Mas tolerância alta demais atrai robôs."}, {"pergunta": "O que é o ataque sanduíche?", "opcoes": ["Um golpe de phishing", "Robôs compram antes da sua troca e vendem logo depois, usando a tolerância que você aceitou", "Uma falha da carteira", "Um tipo de staking"], "correta": 1, "explicacao": "Por isso tolerância alta demais é um convite para robôs."}, {"pergunta": "O que é a perda impermanente?", "opcoes": ["A diferença entre retirar da piscina e ter só guardado as duas moedas, quando o preço muda", "O imposto sobre o lucro", "A perda por hack", "A taxa de saque"], "correta": 0, "explicacao": "A piscina vende o que sobe e acumula o que cai. Se uma moeda dobra em relação à outra, a perda é de cerca de 5,7%."}, {"pergunta": "Quando ser provedor de liquidez compensa?", "opcoes": ["Quando as taxas recebidas superam a perda impermanente", "Nunca", "Só em tokens novos", "Sempre"], "correta": 0, "explicacao": "Pares que andam juntos têm pouca perda; pares que se separam muito podem ter muita."}, {"pergunta": "Em empréstimos DeFi, o que acontece se a garantia cair demais?", "opcoes": ["O banco cobre", "A dívida é perdoada", "Nada", "O contrato liquida a posição: vende parte da garantia e cobra multa"], "correta": 3, "explicacao": "O contrato não sabe quem você é. Por isso exige garantia maior que a dívida e liquida sozinho."}, {"pergunta": "Qual destes NÃO é um risco do staking?", "opcoes": ["Prazo para desfazer o staking", "Punição (slashing) do validador", "Garantia de retorno fixo em reais", "Queda do preço da moeda"], "correta": 2, "explicacao": "Staking não garante retorno em reais. Os riscos são preço, prazo, punição e a plataforma."}], "7": [{"pergunta": "Qual a primeira regra de gestão de risco do curso?", "opcoes": ["Investir tudo em bitcoin", "Só colocar em cripto o que pode perder sem mudar a sua vida", "Usar alavancagem", "Seguir dicas de influenciadores"], "correta": 1, "explicacao": "Antes vêm as contas do mês e a reserva de emergência."}, {"pergunta": "A regra de 1% por operação significa:", "opcoes": ["Colocar só 1% do dinheiro em cada operação",   leitura:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2.5h7l3 3v8H3z"/><path d="M5.5 7.5h5M5.5 10h5"/></svg>',
  exercicios:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 8.5l2 2 4-4.5"/></svg>',
  quiz:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.3a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1v.4"/><circle cx="8" cy="11.4" r=".5" fill="currentColor"/></svg>',
  done:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6.5" fill="currentColor" stroke="none" opacity=".18"/><path d="M5 8.3l2 2 4-4.3"/></svg>'
};
const TIPO = {video:'Aula', leitura:'Leitura', exercicios:'Exercícios', quiz:'Quiz'};

/* progresso deste navegador */
let P = {};
try { P = JSON.parse(localStorage.getItem('bz-area') || '{}') || {}; } catch(e) { P = {}; }
function save(){ try { localStorage.setItem('bz-area', JSON.stringify(P)); } catch(e){} }
const isDone = id => !!(P.d && P.d[id]);
function setDone(id, v=true){ P.d = P.d || {}; if(v) P.d[id]=1; else delete P.d[id]; save(); renderSide(); updTop(); }

/* sequência linear de itens */
const SEQ = [];
C.modulos.forEach(m => {
  SEQ.push({id:'l'+m.n, tipo:'leitura', m, titulo:'Leitura complementar', d:'~6 min'});
  if(m.plus) return;
  SEQ.push({id:'e'+m.n, tipo:'exercicios', m, titulo:'Exercícios', d:m.nex+' ex.'});
});
const MN = m => m.plus ? 'Extra' : m.n;
const AN = a => a.n.startsWith('13.') ? 'Extra.' + a.n.split('.')[1] : a.n;
const BYID = Object.fromEntries(SEQ.map((s,i)=>[s.id,{...s,i}]));
let cur = 'inicio';
const openMods = new Set();

function modProg(m){ const its = SEQ.filter(s=>s.m===m); return [its.filter(s=>isDone(s.id)).length, its.length]; }

function renderSide(){
  const side = document.getElementById('side');
  let h = `<button class="side-home ${cur==='inicio'?'on':''}" data-go="inicio">Visão geral do curso</button>`;
  C.niveis.forEach(nv => {
    h += `<div class="lvl">${nv.nome}</div>`;
    C.modulos.filter(m=>m.nivel===nv.id).forEach(m => {
      const [d,t] = modProg(m);
      const isCur = cur!=='inicio' && BYID[cur] && BYID[cur].m===m;
      h += `<div class="mod ${openMods.has(m.n)?'open':''} ${d===t?'done':''} ${isCur?'cur':''}">
        <button class="mod-h" data-mod="${m.n}" aria-expanded="${openMods.has(m.n)}"><span class="mod-n">${d===t?'✓':(m.plus?'+':m.n)}</span><span class="mod-t">${m.titulo}</span><span class="mod-c">${d}/${t}</span></button>
        <ul class="items">${SEQ.filter(s=>s.m===m).map(s=>`<li><button class="it ${s.id===cur?'on':''} ${isDone(s.id)?'done':''}" data-go="${s.id}"><span class="ic">${isDone(s.id)?ICON.done:ICON[s.tipo]}</span><span>${s.tipo==='video'?AN(s.a)+' · ':''}${s.titulo}</span><span class="d">${s.d}</span></button></li>`).join('')}</ul>
      </div>`;
    });
  });
  side.innerHTML = h;
}
function updTop(){
  const va = SEQ, dv = va.filter(s=>isDone(s.id)).length;
  document.getElementById('progLbl').textContent = `${dv} de ${va.length} itens concluídos`;
  document.getElementById('progShort').textContent = `${dv}/${va.length} itens`;
  document.getElementById('progBar').style.width = (100*SEQ.filter(s=>isDone(s.id)).length/SEQ.length)+'%';
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const mh = e.target.closest('[data-mod]');
  if(mh){ const n=+mh.dataset.mod; openMods.has(n)?openMods.delete(n):openMods.add(n); renderSide(); return; }
});
document.getElementById('homeBtn').onclick = () => go('inicio');
document.getElementById('menuBtn').onclick = () => document.body.classList.toggle('drawer');
document.getElementById('scrim').onclick = () => document.body.classList.remove('drawer');

function go(id, push=true){
  if(id!=='inicio' && !BYID[id]) id='inicio';
  cur = id; document.body.classList.remove('drawer');
  if(id!=='inicio') openMods.add(BYID[id].m.n);
  try { P.last = id; save(); } catch(e){}
  if(push) try{ history.replaceState(null,'','#'+id); }catch(e){}
  renderSide(); render(); window.scrollTo({top:0});
}

function crumb(s){ return `<div class="crumb"><b>Módulo ${MN(s.m)}</b><span>${s.m.titulo}</span><span>·</span><span>${TIPO[s.tipo]}${s.tipo==='video'?' '+AN(s.a):''}</span></div>`; }
function navBtns(s){
  const p = SEQ[s.i-1], n = SEQ[s.i+1];
  const lab = x => x.tipo==='video' ? `Aula ${AN(x.a)} · ${x.titulo}` : `Módulo ${MN(x.m)} · ${x.titulo}`;
  return `<div class="next-up"><button class="nav-b" ${p?'':'hidden'} data-go="${p?p.id:''}"><small>Anterior</small><span>${p?lab(p):''}</span></button><button class="nav-b r" ${n?'':'hidden'} data-go="${n?n.id:''}"><small>Próximo</small><span>${n?lab(n):''}</span></button></div>`;
}

function render(){
  const st = document.getElementById('stage');
  if(cur==='inicio'){ st.innerHTML = home(); return; }
  const s = BYID[cur];
  if(s.tipo==='video') st.innerHTML = vVideo(s);
  if(s.tipo==='leitura') st.innerHTML = vLeitura(s);
  if(s.tipo==='exercicios') st.innerHTML = vEx(s);
  if(s.tipo==='quiz') { st.innerHTML = `${crumb(s)}<h1 class="ttl">Quiz do módulo ${s.m.n}</h1><div class="quiz" id="quiz"></div>${navBtns(s)}`; quiz(s); }
  bindView(s);
}

function home(){
  const tv = C.totalVideo;
  const nextId = SEQ.find(s=>!isDone(s.id)); const last = P.last && BYID[P.last] ? BYID[P.last] : null;
  const alvo = last || nextId || SEQ[0];
  let h = `<section class="hero"><div><div class="crumb"><b>Curso completo</b><span>12 módulos + módulo extra · do básico ao intermediário</span></div>
    <h1>Do bloco <em>zero</em> ao on-chain</h1>
    <p>Material de apoio das aulas da Hotmart: a leitura de cada módulo e os exercícios práticos com correção na hora. As aulas em vídeo e os quizzes ficam na área de membros. O seu progresso fica salvo neste navegador.</p>
    <div class="row" style="margin-top:18px"><button class="btn pri" data-go="${alvo.id}">${last?'Continuar de onde parei':'Começar pelo módulo 1'}</button><span class="chip">${alvo.tipo==='video'?'Aula '+AN(alvo.a):'Módulo '+MN(alvo.m)} · ${alvo.titulo}</span></div></div>
    <div class="stats"><div><b>${C.modulos.length}</b><small>leituras</small></div><div><b>${C.totalEx}</b><small>exercícios práticos</small></div><div><b>1</b><small>projeto final</small></div></div></section>`;
  C.niveis.forEach(nv => {
    const ms = C.modulos.filter(m=>m.nivel===nv.id);
    h += `<div class="lvl-h"><h2>${nv.curto}</h2><span>${ms[0].plus?'ferramentas na prática':'módulos '+ms[0].n+' a '+ms[ms.length-1].n}</span></div><div class="mgrid">`;
    ms.forEach(m => { const [d,t]=modProg(m); const first = SEQ.find(s=>s.m===m && !isDone(s.id)) || SEQ.find(s=>s.m===m);
      h += `<button class="mcard" data-go="${first.id}"><span class="n">MÓDULO ${m.plus?'EXTRA':String(m.n).padStart(2,'0')}</span><h3>${m.titulo}</h3><span class="s">${m.plus?'leitura com links oficiais':'leitura · '+m.nex+' exercícios'}</span><span class="bar"><i style="width:${100*d/t}%"></i></span></button>`; });
    h += `</div>`;
  });
  return h;
}

function vVideo(s){
  const a = s.a, done = isDone(s.id);
  return `${crumb(s)}<h1 class="ttl">${a.titulo}</h1>
  <div class="player"><video id="vid" controls playsinline preload="metadata" src="videos/aula-${a.n.replace('.','-')}.mp4#t=0.5"></video></div>
  <div class="meta"><span>Duração ${a.dur}</span><span>Aula ${a.pos} de ${s.m.aulas.length} do módulo</span>${done?'<span class="chip ok">Concluída</span>':''}</div>
  <div class="card">${s.m.plus?`<h3>Links oficiais</h3><p>A leitura do módulo extra traz o site oficial de cada ferramenta da aula.</p><div class="row" style="margin-top:12px"><button class="btn" data-go="l${s.m.n}">Abrir a leitura com os links</button>`:`<h3>Exercício desta aula</h3><p>${a.ex.join(' · ')}</p><div class="row" style="margin-top:12px"><button class="btn" data-go="e${s.m.n}">Ir para os exercícios do módulo</button>`}<button class="btn ${done?'ok':'pri'}" id="mark">${done?'Aula concluída ✓':'Marcar aula como concluída'}</button></div></div>
  ${navBtns(s)}`;
}

function vLeitura(s){
  const done = isDone(s.id);
  return `${crumb(s)}<h1 class="ttl">${C.leituras[s.m.n].titulo}</h1>
  <article class="read" id="read">${C.leituras[s.m.n].html}</article>
  <div class="row" style="margin-top:24px"><button class="btn ${done?'ok':'pri'}" id="mark">${done?'Leitura concluída ✓':'Marcar leitura como concluída'}</button></div>
  ${navBtns(s)}`;
}

function vEx(s){
  const done = isDone(s.id);
  return `${crumb(s)}<h1 class="ttl">Exercícios do módulo ${s.m.n}</h1>
  <div class="meta"><span>${s.m.nex} exercícios, um por aula</span><span>Correção na hora</span><span>Progresso salvo neste navegador</span></div>
  <div class="exwrap"><iframe id="exf" title="Exercícios do módulo ${s.m.n}" src="exercicios/modulo-${s.m.n}.html"></iframe></div>
  <div class="row" style="margin-top:18px"><button class="btn ${done?'ok':'pri'}" id="mark">${done?'Exercícios concluídos ✓':'Marcar exercícios como feitos'}</button></div>
  ${navBtns(s)}`;
}

function bindView(s){
  const mk = document.getElementById('mark');
  if(mk) mk.onclick = () => { setDone(s.id, !isDone(s.id)); render(); };
  const v = document.getElementById('vid');
  if(v){ v.addEventListener('ended', () => { if(!isDone(s.id)){ setDone(s.id); render(); } });
    try { const t = P.t && P.t[s.id]; if(t) v.addEventListener('loadedmetadata', ()=>{ if(t < v.duration-3) v.currentTime=t; }, {once:true}); } catch(e){}
    v.addEventListener('timeupdate', () => { P.t = P.t||{}; const k=Math.floor(v.currentTime); if(k%5===0){ P.t[s.id]=v.currentTime; save(); } });
  }
  const rd = document.getElementById('read');
  if(rd){ rd.querySelectorAll('input[type=checkbox]').forEach((cb,i) => { const k = s.id+'-'+i; P.c = P.c||{}; cb.checked = !!P.c[k]; cb.onchange = () => { P.c[k] = cb.checked ? 1 : 0; save(); }; }); }
  const f = document.getElementById('exf');
  if(f){ const fit = () => { try { const d = f.contentDocument; if(!d) return; const h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0); if(h>200) f.style.height = (h+8)+'px'; } catch(e){} };
    f.addEventListener('load', () => { fit(); try { new ResizeObserver(fit).observe(f.contentDocument.documentElement); } catch(e){ setInterval(fit, 1000); } setTimeout(fit, 400); setTimeout(fit, 1500); }); }
}

/* quiz */
function quiz(s){
  const Q = C.quizzes[s.m.n], box = document.getElementById('quiz');
  let i = 0, ans = [];
  const L = 'ABCD';
  function q(){
    const it = Q[i], a = ans[i];
    box.innerHTML = `<div class="qhead"><span>Pergunta ${i+1} de ${Q.length}</span><span>${ans.filter((x,k)=>x===Q[k].correta).length} acertos</span></div>
      <div class="qsteps">${Q.map((x,k)=>`<i class="${k===i?'now':ans[k]===undefined?'':(ans[k]===x.correta?'c':'w')}"></i>`).join('')}</div>
      <p class="qq">${it.pergunta}</p>
      <div class="opts">${it.opcoes.map((o,k)=>{ let c=''; if(a!==undefined){ if(k===it.correta)c='right'; else if(k===a)c='wrong'; }
        return `<button class="opt ${c}" data-k="${k}" ${a!==undefined?'disabled':''}><span class="k">${L[k]}</span><span>${o}</span></button>`; }).join('')}</div>
      ${a!==undefined?`<div class="fb ${a===it.correta?'c':'w'}"><b>${a===it.correta?'Certo.':'Não foi dessa vez. A resposta é '+L[it.correta]+'.'}</b><p>${it.explicacao}</p></div>
      <div class="row" style="margin-top:16px"><button class="btn pri" id="qn">${i<Q.length-1?'Próxima pergunta':'Ver resultado'}</button></div>`:''}`;
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => { ans[i] = +b.dataset.k; q(); });
    const n = document.getElementById('qn'); if(n) n.onclick = () => { if(i<Q.length-1){ i++; q(); } else fim(); };
  }
  function fim(){
    const ok = ans.filter((x,k)=>x===Q[k].correta).length, pass = ok>=7;
    P.qs = P.qs||{}; P.qs[s.m.n] = Math.max(P.qs[s.m.n]||0, ok);
    if(pass) setDone(s.id); else save();
    const r = 52, c = 2*Math.PI*r;
    box.innerHTML = `<div class="card score"><svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#25314f" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${pass?'#2DD4BF':'#FFB020'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*ok/10} ${c}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" fill="#E8ECF5" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="600">${ok}/10</text></svg>
      <div><h2>${pass?'Módulo aprovado':'Quase lá'}</h2><p style="color:var(--muted);margin:0 0 14px">${pass?'Você acertou '+ok+' de 10. O quiz conta para o certificado.':'Você acertou '+ok+' de 10. Para aprovar, são 7. Revise as respostas abaixo e tente de novo.'}</p>
      <div class="row"><button class="btn ${pass?'':'pri'}" id="qr">Refazer o quiz</button>${pass&&SEQ[s.i+1]?`<button class="btn pri" data-go="${SEQ[s.i+1].id}">Ir para o próximo módulo</button>`:''}</div></div></div>
      <div class="review">${Q.map((x,k)=>`<div class="rv"><span class="tag ${ans[k]===x.correta?'c':'w'}">${ans[k]===x.correta?'CERTO':'ERRADO'}</span><b>${k+1}. ${x.pergunta}</b><small>Resposta: ${L[x.correta]}) ${x.opcoes[x.correta]}</small></div>`).join('')}</div>`;
    document.getElementById('qr').onclick = () => { i=0; ans=[]; q(); };
  }
  q();
}

/* início */
const h0 = (location.hash||'').slice(1);
go(BYID[h0] ? h0 : 'inicio', false);
updTop();
</script>
