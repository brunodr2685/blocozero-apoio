<title>Bloco Zero · Material de apoio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: área de membros escura, igual aos vídeos — trilho de módulos à esquerda (gaveta no celular), palco à direita com vídeo, leitura, exercícios ou quiz. Tema único escuro, por escolha. */
:root{
  --bg:#0B1020; --panel:#111a2f; --panel2:#172140; --line:#25314f; --line2:#33416a;
  --fg:#E8ECF5; --muted:#9aa6c0; --dim:#6f7c99;
  --amber:#FFB020; --amber-ink:#1a1200; --teal:#2DD4BF; --red:#F87171;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --side:320px; --top:60px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--teal)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--top);display:flex;align-items:center;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(11,16,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);border:0;background:none;padding:0}
.brand-mark{width:28px;height:28px;border-radius:6px;background:var(--amber);display:grid;place-items:center;color:var(--amber-ink);font:800 13px/1 var(--f-mono)}
.brand-name{white-space:nowrap;font:800 17px/1 var(--f-display);font-stretch:118%;letter-spacing:.04em;text-transform:uppercase}
.brand-sub{font:500 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding-left:10px;border-left:1px solid var(--line2)}
.top-prog{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.top-prog .lbl{font:500 12px/1.2 var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{width:160px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber);width:0;transition:width .4s}
.top-prog .short{display:none}
.menu-btn{display:none;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px}

/* casca */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - var(--top))}
.side{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding:14px 10px 40px max(10px,env(safe-area-inset-left,0px))}
.side-home{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;display:flex;gap:10px;align-items:center;font-weight:600}
.side-home:hover{background:var(--panel2)}
.side-home.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--amber)}
.lvl{font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:18px 10px 8px}
.mod{border-radius:10px}
.mod-h{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px}
.mod-h:hover{background:var(--panel2)}
.mod-n{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font:600 13px/1 var(--f-mono);color:var(--muted)}
.mod.done .mod-n{background:var(--teal);border-color:var(--teal);color:#04201c}
.mod.cur .mod-n{border-color:var(--amber);color:var(--amber)}
.mod-t{font-weight:600;font-size:14px;line-height:1.3}
.mod-c{font:500 11px/1 var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
.items{list-style:none;margin:2px 0 8px;padding:0 0 0 22px;display:none}
.mod.open .items{display:block}
.it{width:100%;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;color:var(--muted);font-size:13.5px;border-left:1px solid var(--line)}
.it:hover{background:var(--panel2);color:var(--fg)}
.it.on{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 0 var(--amber)}
.it .ic{width:18px;height:18px;display:grid;place-items:center;color:var(--dim)}
.it.done .ic{color:var(--teal)}
.it .d{font:500 11px/1 var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
.ic svg{width:16px;height:16px}

/* palco */
.main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{max-width:1040px;margin:0 auto}
.crumb{font:500 12px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;flex-wrap:wrap}
.crumb b{color:var(--amber);font-weight:600}
h1.ttl{font:800 clamp(26px,3.6vw,38px)/1.08 var(--f-display);font-stretch:112%;margin:8px 0 18px;text-wrap:balance;letter-spacing:-.01em}
.player{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.player video{width:100%;height:100%;display:block;background:#000}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:16px 0;color:var(--muted);font-size:14px}
.meta span{display:inline-flex;gap:6px;align-items:center}
.chip{font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.chip.ok{border-color:rgba(45,212,191,.5);color:var(--teal);background:rgba(45,212,191,.08)}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ok{border-color:rgba(45,212,191,.6);color:var(--teal)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h3{margin:0 0 6px;font:700 15px/1.3 var(--f-body)}
.card p{margin:0;color:var(--muted)}
.next-up{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:28px}
.nav-b{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 16px;display:grid;gap:4px;min-width:0}
.nav-b:hover{border-color:var(--line2);background:var(--panel2)}
.nav-b small{font:500 11px/1 var(--f-mono);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.nav-b span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-b.r{text-align:right}
.nav-b[hidden]{display:none}

/* início */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.hero h1{font:900 clamp(34px,5vw,58px)/.98 var(--f-display);font-stretch:120%;margin:6px 0 12px;text-transform:uppercase;letter-spacing:-.005em}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{color:var(--muted);max-width:56ch;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats div{background:var(--panel);padding:14px 14px 12px}
.stats b{display:block;font:700 22px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px}
.lvl-h{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.lvl-h h2{font:800 20px/1 var(--f-display);font-stretch:112%;margin:0;text-transform:uppercase;letter-spacing:.02em}
.lvl-h span{font:500 12px/1 var(--f-mono);color:var(--dim)}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mcard{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.mcard:hover{border-color:var(--line2);background:var(--panel2)}
.mcard .n{font:600 12px/1 var(--f-mono);color:var(--amber)}
.mcard h3{margin:0;font:700 16px/1.25 var(--f-body);text-wrap:balance}
.mcard .s{font:500 11.5px/1.4 var(--f-mono);color:var(--dim)}
.mcard .bar{width:100%}

/* leitura */
.read{max-width:70ch}
.read h1{display:none}
.read h2{font:800 22px/1.15 var(--f-display);font-stretch:110%;margin:36px 0 12px;padding-top:18px;border-top:1px solid var(--line)}
.read h3{font:700 17px/1.3 var(--f-body);margin:26px 0 8px;color:var(--amber)}
.read p,.read li{color:#d4dae8}
.read p{margin:0 0 12px}
.read ul,.read ol{padding-left:22px;margin:0 0 14px}
.read li{margin:4px 0}
.read strong{color:var(--fg)}
.read .tw{overflow-x:auto;margin:6px 0 18px;border:1px solid var(--line);border-radius:10px}
.read table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
.read th{text-align:left;background:var(--panel2);font:600 12px/1.3 var(--f-mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.read th,.read td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.read tr:last-child td{border-bottom:0}
.read code{font-family:var(--f-mono);font-size:.92em;background:var(--panel2);padding:1px 5px;border-radius:4px}
.read .formula{font:500 15px/1.5 var(--f-mono);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:8px;padding:14px 16px;margin:6px 0 16px}
.read li.task{list-style:none;margin-left:-22px}
.read li.task label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.read li.task input{width:18px;height:18px;margin-top:3px;accent-color:var(--teal);flex:none}
.lead{font-size:17px;color:var(--fg)!important}

/* exercícios */
.exwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.exwrap iframe{display:block;width:100%;border:0;height:1200px;background:var(--bg)}

/* quiz */
.quiz{max-width:760px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font:500 12px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.qsteps{display:flex;gap:4px;margin-bottom:22px}
.qsteps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.qsteps i.c{background:var(--teal)}.qsteps i.w{background:var(--red)}.qsteps i.now{background:var(--amber)}
.qq{font:700 clamp(19px,2.2vw,23px)/1.3 var(--f-body);margin:0 0 18px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:13px 14px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--muted);background:var(--panel2)}
.opt .k{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font:600 13px/1 var(--f-mono);color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--teal);background:rgba(45,212,191,.08)}
.opt.right .k{background:var(--teal);border-color:var(--teal);color:#04201c}
.opt.wrong{border-color:var(--red);background:rgba(248,113,113,.08)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#2a0606}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--panel)}
.fb b{display:block;margin-bottom:4px}
.fb.c b{color:var(--teal)}.fb.w b{color:var(--red)}
.fb p{margin:0;color:#d4dae8}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.ring{width:120px;height:120px}
.score h2{font:800 26px/1.1 var(--f-display);font-stretch:110%;margin:0 0 6px}
.review{margin-top:22px;display:grid;gap:10px}
.rv{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
.rv b{font-weight:600}
.rv small{display:block;color:var(--muted);margin-top:4px}
.rv .tag{font:600 11px/1 var(--f-mono);margin-right:8px}
.rv .tag.c{color:var(--teal)}.rv .tag.w{color:var(--red)}

.scrim{display:none}
@media (max-width:1000px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .side{position:fixed;left:0;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:0;height:auto;width:min(88vw,340px);z-index:25;transform:translateX(-102%);transition:transform .25s;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;z-index:24;background:rgba(0,0,0,.5)}
  .brand-sub,.bar,.top-prog .lbl:not(.short){display:none}
  .top-prog .short{display:inline}
}
@media (max-width:560px){.mgrid{grid-template-columns:minmax(0,1fr)}.next-up{grid-template-columns:minmax(0,1fr)}.nav-b.r{text-align:left}.stats b{font-size:18px}.score{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="Abrir o conteúdo do curso">Conteúdo</button>
  <button class="brand" id="homeBtn" aria-label="Início do curso"><span class="brand-mark">0</span><span class="brand-name">Bloco Zero</span><span class="brand-sub">Material de apoio</span></button>
  <div class="top-prog"><span class="lbl" id="progLbl">0 de 50 aulas</span><span class="lbl short" id="progShort">0/50</span><span class="bar"><i id="progBar"></i></span></div>
</header>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Conteúdo do curso"></nav>
  <main class="main"><div class="stage" id="stage"></div></main>
</div>

Relatórios de cinco tokens"]}, {"n": "10.2", "titulo": "Holders e o dev", "dur": "1:59", "pos": 2, "ex": ["Avalie a distribuição"]}, {"n": "10.3", "titulo": "Bundlers e robôs", "dur": "2:04", "pos": 3, "ex": ["Combinadas ou não?"]}, {"n": "10.4", "titulo": "Liquidez", "dur": "2:05", "pos": 4, "ex": ["Casos: passa ou não no checklist?"]}], "nex": 4, "durTotal": "8:51"}, {"n": 11, "titulo": "Memecoins e launchpads", "nivel": 2, "plus": false, "aulas": [{"n": "11.1", "titulo": "A curva de lançamento", "dur": "2:15", "pos": 1, "ex": ["Simulador de curva de lançamento"]}, {"n": "11.2", "titulo": "A graduação", "dur": "2:02", "pos": 2, "ex": ["Quem lucrou?"]}, {"n": "11.3", "titulo": "Golpes e rug pull", "dur": "2:03", "pos": 3, "ex": ["Que golpe é esse?"]}, {"n": "11.4", "titulo": "Sinais de alerta", "dur": "1:46", "pos": 4, "ex": ["Sinal de alerta ou não?"]}], "nex": 4, "durTotal": "8:07"}, {"n": 12, "titulo": "A sua estratégia no papel", "nivel": 2, "plus": false, "aulas": [{"n": "12.1", "titulo": "A sua estratégia no papel", "dur": "2:14", "pos": 1, "ex": ["Preencha o seu plano"]}, {"n": "12.2", "titulo": "A revisão por checklist", "dur": "2:00", "pos": 2, "ex": ["Checklist final do curso"]}, {"n": "12.3", "titulo": "Fechando o curso", "dur": "1:29", "pos": 3, "ex": ["O plano aguenta estas situações?"]}], "nex": 3, "durTotal": "5:43"}, {"n": 13, "titulo": "Ferramentas na prática", "nivel": 3, "plus": true, "aulas": [{"n": "13.1", "titulo": "Carteiras de navegador e de celular", "dur": "2:46", "pos": 1, "ex": []}, {"n": "13.2", "titulo": "Carteiras de hardware: Ledger e Trezor", "dur": "2:58", "pos": 2, "ex": []}, {"n": "13.3", "titulo": "Sites de dados e de análise", "dur": "3:08", "pos": 3, "ex": []}], "nex": 0, "durTotal": "8:53"}], "leituras": {"1": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">Dinheiro é um registro baseado em confiança, e o Bitcoin troca o banco que guarda esse registro por um livro público mantido por milhares de computadores. Leia depois dos cinco vídeos do módulo e antes do quiz.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>1.1 O que é dinheiro<\/h3>\n<p>O escambo exige que os dois lados queiram, ao mesmo tempo, o que o outro tem. O dinheiro resolve isso porque todo mundo aceita, mesmo sem querer usá-lo diretamente. Sal, conchas, ouro e prata já cumpriram esse papel.<\/p>\n<p>Todo dinheiro faz três trabalhos:<\/p>\n<ul>\n<li><strong>Meio de troca<\/strong>: serve para pagar.<\/li>\n<li><strong>Unidade de conta<\/strong>: serve para medir preços.<\/li>\n<li><strong>Reserva de valor<\/strong>: guarda poder de compra para depois.<\/li>\n<\/ul>\n<p>Desde 1971, quando os Estados Unidos acabaram com a troca do dólar por ouro, as moedas são fiduciárias: valem pela confiança em quem as emite. Quando essa confiança falha, a reserva de valor é a primeira a sofrer. Em 1993, a inflação brasileira passou de 2.400% no ano, e o país só estabilizou com o Real, em julho de 1994.<\/p>\n<p>Hoje quase todo dinheiro é um registro digital. Num Pix, nenhuma nota se move: um banco tira do seu saldo e outro soma no saldo de quem recebe. Quem controla esse registro pode aprovar, bloquear ou reverter uma transferência.<\/p>\n<h3>1.2 O problema do gasto duplo<\/h3>\n<p>No digital, copiar é de graça. Um dinheiro digital precisa garantir que o valor saiu de um lugar antes de chegar no outro. Sem isso, a mesma moeda seria gasta duas vezes.<\/p>\n<p>A solução tradicional é um intermediário, como o banco, que é o único a escrever no livro de contas. Funciona, mas exige confiar nele.<\/p>\n<p>Em outubro de 2008, Satoshi Nakamoto propôs outra saída: um livro público, com cópias em milhares de computadores, que seguem as mesmas regras. As transferências entram em blocos, um depois do outro. Se alguém tenta gastar a mesma moeda duas vezes, vale a transferência que entrar primeiro num bloco; a outra é rejeitada. O primeiro bloco do Bitcoin, o bloco zero, é de 3 de janeiro de 2009.<\/p>\n<h3>1.3 Hash: a impressão digital dos dados<\/h3>\n<p>Um hash transforma qualquer dado numa sequência de tamanho fixo. No SHA-256, usado no Bitcoin, são sempre 64 caracteres. Três propriedades importam:<\/p>\n<ol>\n<li>A mesma entrada sempre gera o mesmo hash.<\/li>\n<li>Mudar uma letra muda o hash por completo, sem padrão previsível.<\/li>\n<li>É uma via de mão única: do hash não se volta ao dado.<\/li>\n<\/ol>\n<p>Cada bloco guarda no cabeçalho o hash do bloco anterior. Se alguém altera um bloco antigo, o hash dele muda e o elo com o próximo se rompe. Para esconder a fraude, seria preciso refazer esse bloco e todos os seguintes, e a cópia alterada ainda não bateria com as milhares de cópias da rede.<\/p>\n<h3>1.4 Mineração<\/h3>\n<p>Para escrever o próximo bloco, é preciso provar trabalho: achar um hash que comece com certa quantidade de zeros. O minerador muda um número do cabeçalho, o nonce, e tenta de novo até acertar. Achar é difícil; conferir é um único cálculo.<\/p>\n<p>Quem acha o bloco ganha bitcoins novos mais as taxas das transferências incluídas. A cada 2.016 blocos, cerca de duas semanas, a rede ajusta a dificuldade para manter a média de um bloco a cada 10 minutos.<\/p>\n<p>Reescrever o passado exigiria mais poder de computação do que todo o resto da rede junto. É isso que torna a fraude cara. O gasto de energia é o preço dessa segurança e também o principal alvo de críticas.<\/p>\n<h3>1.5 Oferta e halving<\/h3>\n<p>O código limita o Bitcoin a 21 milhões de unidades. A recompensa por bloco cai pela metade a cada 210.000 blocos, cerca de quatro anos: 50 em 2009, 25 em 2012, 12,5 em 2016, 6,25 em 2020 e 3,125 desde abril de 2024. O próximo corte deve vir por volta de 2028.<\/p>\n<p>Cada bitcoin se divide em 100 milhões de satoshis, então ninguém precisa comprar uma unidade inteira. Parte das moedas já se perdeu em carteiras sem chave, o que reduz a oferta disponível.<\/p>\n<p>Escassez não garante alta. O preço depende de quem quer comprar e vender, e o Bitcoin já caiu mais de 70% mais de uma vez.<\/p>\n<h2>Na prática: a conta da emissão<\/h2>\n<p>Com um bloco a cada 10 minutos, a rede cria hoje cerca de 450 bitcoins por dia. Faça a conta com a gente:<\/p>\n<ol>\n<li>Blocos por dia: 24 horas × 60 minutos ÷ 10 = 144 blocos.<\/li>\n<li>Emissão por dia desde abril de 2024: 144 × 3,125 = 450 BTC.<\/li>\n<li>Emissão por ano: 450 × 365 = cerca de 164 mil BTC.<\/li>\n<li>Depois do halving de 2028: 144 × 1,5625 = 225 BTC por dia.<\/li>\n<\/ol>\n<p>O limite de 21 milhões sai da soma das eras. A primeira era criou 210.000 × 50 = 10,5 milhões. A segunda, metade disso: 5,25 milhões. A terceira, 2,625 milhões. Cada era soma metade da anterior, e o total se aproxima de 21 milhões sem passar.<\/p>\n<p>Agora, as frações. Com um preço hipotético de R$ 600.000 por bitcoin, R$ 100 compram 100 ÷ 600.000 = 0,000167 BTC, ou cerca de 16.700 satoshis. O preço real muda o tempo todo; o que importa é o raciocínio.<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Escambo<\/td>\n<td>Troca direta de uma coisa por outra, sem dinheiro<\/td>\n<\/tr>\n<tr>\n<td>Moeda fiduciária<\/td>\n<td>Moeda que vale pela confiança em quem a emite, sem lastro em ouro<\/td>\n<\/tr>\n<tr>\n<td>Gasto duplo<\/td>\n<td>Gastar a mesma moeda digital duas vezes<\/td>\n<\/tr>\n<tr>\n<td>Blockchain<\/td>\n<td>Livro público de transferências, organizado em blocos encadeados<\/td>\n<\/tr>\n<tr>\n<td>Bloco<\/td>\n<td>Pacote de transferências com um cabeçalho que guarda o hash do bloco anterior<\/td>\n<\/tr>\n<tr>\n<td>Hash (SHA-256)<\/td>\n<td>Impressão digital de tamanho fixo de qualquer dado<\/td>\n<\/tr>\n<tr>\n<td>Nonce<\/td>\n<td>Número que o minerador muda a cada tentativa de achar o hash<\/td>\n<\/tr>\n<tr>\n<td>Mineração<\/td>\n<td>Trabalho de computação que dá o direito de escrever o próximo bloco<\/td>\n<\/tr>\n<tr>\n<td>Dificuldade<\/td>\n<td>Exigência de zeros no hash, ajustada a cada 2.016 blocos<\/td>\n<\/tr>\n<tr>\n<td>ASIC<\/td>\n<td>Máquina feita só para minerar<\/td>\n<\/tr>\n<tr>\n<td>Pool<\/td>\n<td>Grupo de mineradores que divide o trabalho e o prêmio<\/td>\n<\/tr>\n<tr>\n<td>Halving<\/td>\n<td>Corte pela metade da recompensa por bloco, a cada 210.000 blocos<\/td>\n<\/tr>\n<tr>\n<td>Satoshi<\/td>\n<td>A menor parte de um bitcoin: 0,00000001 BTC<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://bitcoin.org/bitcoin.pdf\">Bitcoin: A Peer-to-Peer Electronic Cash System<\/a>: o documento de nove páginas de Satoshi Nakamoto, de 2008 (em inglês).<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ethereum.org/pt-br/what-is-ethereum/\">O que é Ethereum?<\/a>: para comparar com o Bitcoin antes do módulo 4.<\/li>\n<\/ul>\n<p>Este material é educativo e não é recomendação de investimento. Criptomoedas oscilam muito, e você pode perder dinheiro.<\/p>"}, "2": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">Quem controla a chave privada controla as moedas, e quase todo golpe em cripto tenta fazer você entregar essa chave ou assinar algo com ela. Leia depois dos cinco vídeos do módulo e antes do quiz.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>2.1 Corretora ou autocustódia<\/h3>\n<p>No livro público não aparece o seu nome, e sim endereços. Cada endereço nasce de uma chave privada, um número secreto enorme. O caminho é de mão única: chave privada → chave pública → endereço. Por isso o endereço pode ser mostrado a qualquer um.<\/p>\n<p>Para mover moedas, a rede exige uma assinatura feita com a chave privada. A carteira não guarda moedas; guarda chaves e assina por você. Há dois jeitos de guardar as chaves:<\/p>\n<ul>\n<li><strong>Custódia de terceiros<\/strong>: a corretora guarda e movimenta em seu nome. O risco é a empresa, como mostraram a Mt. Gox, em 2014, e a FTX, em 2022.<\/li>\n<li><strong>Autocustódia<\/strong>: você guarda as chaves. Ninguém bloqueia as suas moedas, mas ninguém recupera o acesso se você perder as chaves.<\/li>\n<\/ul>\n<p>Muita gente usa os dois: a corretora para comprar e vender, a autocustódia para guardar.<\/p>\n<h3>2.2 A frase de recuperação<\/h3>\n<p>Toda carteira de autocustódia gera uma lista de 12 ou 24 palavras, tiradas de uma lista fixa de 2.048. Dessas palavras saem todas as chaves da carteira, sempre as mesmas. Com elas, você recupera tudo num aparelho novo. Qualquer outra pessoa também.<\/p>\n<p>Regras que não têm exceção:<\/p>\n<ol>\n<li>Nada digital: sem foto, print, bloco de notas, e-mail ou nuvem.<\/li>\n<li>Escreva à mão, na ordem, e confira antes de mandar dinheiro para a carteira.<\/li>\n<li>Para valores maiores, considere gravar em placa de metal.<\/li>\n<li>Ninguém legítimo pede a sua frase. Nem suporte, nem fabricante, nem site de brinde.<\/li>\n<\/ol>\n<h3>2.3 A carteira de hardware<\/h3>\n<p>Carteira quente vive num aparelho conectado; carteira fria guarda as chaves fora da internet. A carteira de hardware é a carteira fria mais comum: a chave nasce dentro do aparelho e nunca sai dele.<\/p>\n<p>O aplicativo monta a transferência, o aparelho mostra endereço e valor na própria tela, e você aperta o botão. A assinatura acontece lá dentro. Mesmo com o computador infectado, nada sai sem o seu botão. Por isso, confira o endereço na tela do aparelho.<\/p>\n<p>Compre do fabricante ou de revendedor oficial, nunca usado. Se o aparelho vier com uma frase já escrita, é golpe: a frase tem que ser criada por você.<\/p>\n<h3>2.4 Os golpes mais comuns<\/h3>\n<p>Transferência confirmada não volta. Por isso o golpista não invade: ele convence.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Golpe<\/th>\n<th>Como funciona<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Falso suporte<\/td>\n<td>Alguém \"da corretora\" chama no privado e pede a frase<\/td>\n<\/tr>\n<tr>\n<td>Site falso (phishing)<\/td>\n<td>Página idêntica, com endereço quase igual, captura senha ou frase<\/td>\n<\/tr>\n<tr>\n<td>Rendimento garantido<\/td>\n<td>Pirâmide: paga os antigos com o dinheiro dos novos até quebrar<\/td>\n<\/tr>\n<tr>\n<td>Brinde falso<\/td>\n<td>Token desconhecido leva a um site que pede uma assinatura drenadora<\/td>\n<\/tr>\n<tr>\n<td>Endereço parecido<\/td>\n<td>Envio minúsculo de um endereço com início e fim iguais ao de um contato<\/td>\n<\/tr>\n<tr>\n<td>Relacionamento<\/td>\n<td>Semanas de conversa até apresentar uma plataforma falsa<\/td>\n<\/tr>\n<tr>\n<td>Recuperação<\/td>\n<td>Promete devolver o que você perdeu, mediante taxa<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Os sinais se repetem: pressa, ganho fácil, pedido de segredo e contato que começou do lado de lá.<\/p>\n<h3>2.5 O seu checklist de segurança<\/h3>\n<p>Segurança é hábito, não truque. Os oito hábitos do módulo:<\/p>\n<ol>\n<li>Senha longa e única por corretora, num gerenciador de senhas.<\/li>\n<li>Verificação em duas etapas por aplicativo, não por SMS.<\/li>\n<li>Frase de recuperação só no papel ou no metal.<\/li>\n<li>Conferir início e fim de todo endereço; nunca copiar do histórico.<\/li>\n<li>Entrar nos sites por favorito, nunca por anúncio ou mensagem.<\/li>\n<li>Carteira separada, com pouco dinheiro, para testar sites novos.<\/li>\n<li>Pouco na corretora e na carteira quente; o resto na carteira fria.<\/li>\n<li>Discrição sobre saldos e um plano combinado com alguém de confiança.<\/li>\n<\/ol>\n<h2>Na prática: a sua primeira carteira<\/h2>\n<p>A ordem abaixo evita os erros mais caros de quem está começando. Faça tudo sem pressa, num lugar sem câmeras e sem ninguém olhando a tela.<\/p>\n<ol>\n<li>Baixe o aplicativo da carteira só pela loja oficial e confira o nome de quem publicou.<\/li>\n<li>Crie a carteira e anote as palavras à mão, numeradas, na ordem em que aparecem.<\/li>\n<li>Confirme as palavras quando o aplicativo pedir. Releia a sua cópia letra por letra.<\/li>\n<li>Guarde o papel num lugar seguro, longe de umidade e de outros documentos que circulam.<\/li>\n<li>Teste a recuperação: apague a carteira do aparelho e restaure com as palavras, ainda sem saldo.<\/li>\n<li>Só então receba um valor pequeno, como no teste do módulo 3.<\/li>\n<\/ol>\n<p>Se algo der errado no passo 5, o problema está na cópia. Melhor descobrir agora, com a carteira vazia.<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Chave privada<\/td>\n<td>Número secreto que assina as transferências; quem tem, é dono<\/td>\n<\/tr>\n<tr>\n<td>Chave pública<\/td>\n<td>Derivada da chave privada; dela sai o endereço<\/td>\n<\/tr>\n<tr>\n<td>Endereço<\/td>\n<td>Onde as moedas são recebidas; pode ser compartilhado<\/td>\n<\/tr>\n<tr>\n<td>Assinatura<\/td>\n<td>Prova, feita com a chave privada, de que o dono autorizou a transferência<\/td>\n<\/tr>\n<tr>\n<td>Custódia de terceiros<\/td>\n<td>Uma empresa guarda as chaves por você<\/td>\n<\/tr>\n<tr>\n<td>Autocustódia<\/td>\n<td>Você guarda as próprias chaves<\/td>\n<\/tr>\n<tr>\n<td>Frase de recuperação<\/td>\n<td>12 ou 24 palavras que geram todas as chaves da carteira<\/td>\n<\/tr>\n<tr>\n<td>Carteira quente<\/td>\n<td>Carteira num aparelho conectado à internet<\/td>\n<\/tr>\n<tr>\n<td>Carteira fria<\/td>\n<td>Carteira que guarda as chaves fora da internet<\/td>\n<\/tr>\n<tr>\n<td>Carteira de hardware<\/td>\n<td>Aparelho dedicado que cria e guarda a chave e assina lá dentro<\/td>\n<\/tr>\n<tr>\n<td>Phishing<\/td>\n<td>Golpe com site ou mensagem falsa que imita uma empresa real<\/td>\n<\/tr>\n<tr>\n<td>Drenador<\/td>\n<td>Programa que usa uma assinatura sua para esvaziar a carteira<\/td>\n<\/tr>\n<tr>\n<td>Pirâmide<\/td>\n<td>Esquema que paga os antigos com o dinheiro de quem entra depois<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ethereum.org/pt-br/security/\">Segurança no Ethereum e prevenção de golpes<\/a>: guia oficial do ethereum.org, em português.<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/bitcoin/bips/blob/master/bip-0039.mediawiki\">BIP-39<\/a>: o padrão técnico das frases de recuperação (em inglês).<\/li>\n<\/ul>\n<p>Este material é educativo e não é recomendação de investimento, de corretora ou de carteira.<\/p>"}, "3": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">Toda transferência de cripto se resume a três conferências, nesta ordem: moeda, rede e endereço, com um teste pequeno antes do valor total. Leia depois dos quatro vídeos do módulo e antes do quiz.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>3.1 Corretoras e Pix<\/h3>\n<p>A corretora é a ponte entre o real e as criptomoedas. No Brasil, as regras do Banco Central para corretoras estão em vigor desde fevereiro de 2026, com prazo de adaptação e exigência de autorização. Antes de abrir conta, confira se a empresa está autorizada ou em processo de autorização.<\/p>\n<p>A abertura pede documentos e selfie: é a verificação de identidade, exigida contra fraude e lavagem de dinheiro. Desconfie de corretora que não pede nada. O depósito por Pix tem que sair de conta no seu CPF; Pix de terceiros costuma ser devolvido ou travado.<\/p>\n<p>Há dois jeitos de comprar:<\/p>\n<ul>\n<li><strong>Conversão (compra rápida)<\/strong>: simples, mas o preço costuma vir com margem embutida.<\/li>\n<li><strong>Livro de ofertas<\/strong>: você compra pelo melhor preço disponível ou deixa uma ordem esperando o preço que escolheu.<\/li>\n<\/ul>\n<p>Compare sempre o custo total: taxa de negociação, margem da conversão e taxa de saque.<\/p>\n<h3>3.2 Redes e endereços<\/h3>\n<p>Cada blockchain é uma rede separada, e uma não enxerga o livro da outra. Algumas moedas, como o USDT, existem em várias redes: Ethereum, Tron, Solana e outras. É a mesma moeda em livros diferentes.<\/p>\n<p>A regra: a rede escolhida no envio tem que ser a mesma aceita por quem recebe. Os formatos de endereço ajudam a perceber erros, mas não bastam:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Rede<\/th>\n<th>Como o endereço costuma começar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bitcoin<\/td>\n<td>1, 3 ou bc1<\/td>\n<\/tr>\n<tr>\n<td>Ethereum e redes compatíveis<\/td>\n<td>0x, seguido de 40 caracteres<\/td>\n<\/tr>\n<tr>\n<td>Solana<\/td>\n<td>Sequência longa de letras e números<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Como redes compatíveis com a Ethereum usam o mesmo formato, o formato certo não prova que a rede está certa. Copie e cole ou leia o QR code, e confira os primeiros e os últimos caracteres.<\/p>\n<h3>3.3 Taxas e memo<\/h3>\n<p>Toda transferência paga taxa de rede a quem a coloca no bloco: mineradores no Bitcoin, validadores na Ethereum e na Solana. O espaço no bloco é limitado, então a taxa sobe quando a rede está cheia.<\/p>\n<p>No Bitcoin, a taxa depende do tamanho da transferência em bytes, não do valor. Na corretora, o saque tem taxa fixa por moeda e por rede, e a diferença entre redes pode ir de centavos a vários reais.<\/p>\n<p>Em redes como XRP, Stellar e TON, a corretora usa um endereço para muitos clientes e identifica cada depósito por um memo ou tag. Se a corretora mostrar um memo, ele é obrigatório. Sem ele, o dinheiro chega na empresa, mas não na sua conta.<\/p>\n<h3>3.4 A transferência de teste<\/h3>\n<p>A primeira transferência para um endereço novo é sempre um teste:<\/p>\n<ol>\n<li>No destino, escolha moeda e rede e copie o endereço e o memo, se houver.<\/li>\n<li>Na origem, escolha a mesma moeda e a mesma rede, cole e confira.<\/li>\n<li>Mande um valor pequeno, acima do mínimo de depósito e que pague a taxa com folga.<\/li>\n<li>Acompanhe pelo hash da transação num explorador de blocos.<\/li>\n<li>Confirmado o crédito, mande o restante pelo mesmo caminho.<\/li>\n<\/ol>\n<p>As confirmações são os blocos que entram depois do bloco da sua transferência. Cada uma torna mais difícil desfazer a anterior, e por isso as corretoras esperam algumas antes de liberar o saldo.<\/p>\n<h2>Na prática: quanto chega do outro lado<\/h2>\n<p>No exemplo abaixo, o caminho mais barato entrega cerca de R$ 12 a mais a cada R$ 1.000. As taxas são ilustrativas; cada corretora publica as suas.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Etapa<\/th>\n<th>Caminho A<\/th>\n<th>Caminho B<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Compra de R$ 1.000<\/td>\n<td>Conversão com margem de 1,5%: R$ 985<\/td>\n<td>Livro de ofertas com taxa de 0,5%: R$ 995<\/td>\n<\/tr>\n<tr>\n<td>Saque para a sua carteira<\/td>\n<td>Rede com taxa de R$ 5: R$ 980<\/td>\n<td>Rede com taxa de R$ 3: R$ 992<\/td>\n<\/tr>\n<tr>\n<td>Chega na carteira<\/td>\n<td>R$ 980<\/td>\n<td>R$ 992<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Antes do valor total, entra o teste. Se o teste for de R$ 50 e a taxa de saque for de R$ 3, chegam R$ 47. Custa uma taxa a mais, mas confirma rede, endereço e memo de uma vez.<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Corretora<\/td>\n<td>Empresa que compra, vende e guarda cripto para clientes<\/td>\n<\/tr>\n<tr>\n<td>Verificação de identidade<\/td>\n<td>Envio de documentos e selfie para abrir conta, exigido por lei<\/td>\n<\/tr>\n<tr>\n<td>Conversão<\/td>\n<td>Compra rápida por um preço fechado, com margem embutida<\/td>\n<\/tr>\n<tr>\n<td>Livro de ofertas<\/td>\n<td>Lista de quem quer comprar e vender, cada um com seu preço<\/td>\n<\/tr>\n<tr>\n<td>Rede<\/td>\n<td>Blockchain onde a transferência acontece, como Bitcoin, Ethereum ou Solana<\/td>\n<\/tr>\n<tr>\n<td>Taxa de rede<\/td>\n<td>Pagamento a quem inclui a transferência no bloco<\/td>\n<\/tr>\n<tr>\n<td>Taxa de saque<\/td>\n<td>Valor que a corretora cobra para enviar a moeda para fora<\/td>\n<\/tr>\n<tr>\n<td>Memo ou tag<\/td>\n<td>Número que identifica o seu depósito num endereço compartilhado<\/td>\n<\/tr>\n<tr>\n<td>Hash da transação<\/td>\n<td>Código que identifica uma transferência no livro público<\/td>\n<\/tr>\n<tr>\n<td>Explorador de blocos<\/td>\n<td>Site que mostra o livro público de uma rede<\/td>\n<\/tr>\n<tr>\n<td>Confirmação<\/td>\n<td>Cada bloco que entra depois do bloco da sua transferência<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/l14478.htm\">Lei 14.478/2022<\/a>: o marco legal das prestadoras de serviços de ativos virtuais.<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/decreto/D11563.htm\">Decreto 11.563/2023<\/a>: define o Banco Central como regulador dessas empresas.<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://solana.com/docs/core/fees\">Taxas na Solana<\/a>: documentação oficial (em inglês).<\/li>\n<\/ul>\n<p>Este material é educativo e não é recomendação de investimento nem indicação de corretora.<\/p>"}, "4": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">Contratos inteligentes são programas públicos que rodam sozinhos na blockchain, e deles nascem tokens, NFTs e stablecoins, cada um com o seu risco. Leia depois dos quatro vídeos do módulo e antes do quiz.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>4.1 Contratos inteligentes<\/h3>\n<p>O Bitcoin registra quem tem quantos bitcoins. Em 2013, Vitalik Buterin propôs uma blockchain onde qualquer pessoa publica programas, e o Ethereum entrou no ar em julho de 2015. Esses programas são os contratos inteligentes: código guardado na blockchain que roda sempre do mesmo jeito quando alguém chama, com o resultado registrado em público.<\/p>\n<p>A analogia é a máquina de refrigerante: cumpriu a condição, a máquina entrega, sem vendedor. O código faz exatamente o que está escrito, inclusive os erros. Em 2016, uma falha no contrato The DAO permitiu desviar milhões de ether.<\/p>\n<p>Desde setembro de 2022, o Ethereum usa prova de participação: quem valida deixa ether travado como garantia e perde parte dele se fraudar. A Solana, no ar desde 2020, aposta em velocidade e taxas baixas, mas já ficou fora do ar algumas vezes.<\/p>\n<h3>4.2 Tokens e NFTs<\/h3>\n<p>A maioria das moedas não tem rede própria: são tokens, criados por contratos em cima de uma rede existente. Um token é uma tabela dentro do contrato, com o saldo de cada endereço. Na Ethereum, o padrão mais usado é o ERC-20.<\/p>\n<p>Criar um token leva minutos. Por isso existem milhões, e a imensa maioria não vale nada. Nome famoso e logo bonito não dizem nada sobre o token.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo<\/th>\n<th>Exemplo<\/th>\n<th>Característica<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Moeda da rede<\/td>\n<td>ETH na Ethereum, SOL na Solana<\/td>\n<td>Paga as taxas da própria rede<\/td>\n<\/tr>\n<tr>\n<td>Token comum (fungível)<\/td>\n<td>Um token ERC-20<\/td>\n<td>Cada unidade é igual a qualquer outra<\/td>\n<\/tr>\n<tr>\n<td>NFT (não fungível)<\/td>\n<td>Ingresso, item de jogo, obra digital<\/td>\n<td>Cada unidade é única e tem número próprio<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>O NFT registra a posse de um item, mas quase sempre a imagem fica fora da blockchain, num link. E ter o NFT não dá direitos autorais sobre a obra.<\/p>\n<h3>4.3 As taxas de rede<\/h3>\n<p>Cada operação na Ethereum gasta uma quantidade de gas. Uma transferência simples gasta 21.000 unidades; uma troca num contrato pode gastar dez vezes mais. A taxa é o gas gasto vezes o preço do gas, medido em gwei, um bilionésimo de ether.<\/p>\n<p>O preço tem uma parte básica, que sobe com os blocos cheios, e uma gorjeta opcional para passar na frente. O valor enviado não muda a taxa. Redes de segunda camada juntam milhares de transferências e registram só um resumo na Ethereum, dividindo o custo. Na Solana, a taxa básica é de 5.000 lamports por assinatura, com taxa de prioridade opcional.<\/p>\n<h3>4.4 Stablecoins<\/h3>\n<p>Stablecoins tentam valer sempre o mesmo que uma moeda tradicional, quase sempre o dólar. As maiores, USDT (2014) e USDC (2018), funcionam com reservas em contas e títulos do governo americano. O valor depende da confiança nessas reservas.<\/p>\n<p>Dois episódios mostram os riscos:<\/p>\n<ul>\n<li><strong>USDC, março de 2023<\/strong>: parte das reservas estava no Silicon Valley Bank, que quebrou. O token chegou a cerca de US$ 0,87 até o governo americano garantir os depósitos.<\/li>\n<li><strong>UST, maio de 2022<\/strong>: stablecoin algorítmica, sem reservas. Perdeu a paridade, foi a quase zero e levou dezenas de bilhões de dólares.<\/li>\n<\/ul>\n<p>A maioria das stablecoins pode ser congelada pelo emissor. No Brasil, desde 2026, comprar e vender stablecoins atreladas a moeda estrangeira segue as regras de câmbio do Banco Central.<\/p>\n<h2>Na prática: a conta do gas<\/h2>\n<p>A mesma troca de moedas pode custar R$ 4,50 num dia calmo e R$ 45 num dia de euforia. Os preços abaixo são hipotéticos: ether a R$ 15.000 e SOL a R$ 1.000.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Operação<\/th>\n<th>Gas<\/th>\n<th>Preço do gas<\/th>\n<th>Taxa em ether<\/th>\n<th>Taxa em reais<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Transferência simples, dia calmo<\/td>\n<td>21.000<\/td>\n<td>2 gwei<\/td>\n<td>0,000042<\/td>\n<td>R$ 0,63<\/td>\n<\/tr>\n<tr>\n<td>Troca num contrato, dia calmo<\/td>\n<td>150.000<\/td>\n<td>2 gwei<\/td>\n<td>0,0003<\/td>\n<td>R$ 4,50<\/td>\n<\/tr>\n<tr>\n<td>Troca num contrato, dia de euforia<\/td>\n<td>150.000<\/td>\n<td>20 gwei<\/td>\n<td>0,003<\/td>\n<td>R$ 45,00<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A conta é sempre a mesma: gas × preço do gas = taxa em gwei. Depois, divida por 1 bilhão para ter o valor em ether. Exemplo: 21.000 × 2 = 42.000 gwei = 0,000042 ether.<\/p>\n<p>Na Solana, uma transferência simples com uma assinatura paga 0,000005 SOL, ou meio centavo de real com o preço hipotético. Por isso, para valores pequenos, a escolha da rede pesa mais do que a escolha da moeda.<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Contrato inteligente<\/td>\n<td>Programa guardado na blockchain que roda sozinho e em público<\/td>\n<\/tr>\n<tr>\n<td>Prova de participação<\/td>\n<td>Validação com moedas travadas como garantia, no lugar da mineração<\/td>\n<\/tr>\n<tr>\n<td>Token<\/td>\n<td>Moeda criada por um contrato em cima de uma rede existente<\/td>\n<\/tr>\n<tr>\n<td>ERC-20<\/td>\n<td>Padrão de token mais usado na Ethereum<\/td>\n<\/tr>\n<tr>\n<td>Fungível<\/td>\n<td>Uma unidade vale o mesmo que qualquer outra do mesmo tipo<\/td>\n<\/tr>\n<tr>\n<td>NFT<\/td>\n<td>Token não fungível: cada unidade é única e registra a posse de um item<\/td>\n<\/tr>\n<tr>\n<td>Gas<\/td>\n<td>Unidade de custo de cada operação na Ethereum<\/td>\n<\/tr>\n<tr>\n<td>Gwei<\/td>\n<td>Um bilionésimo de ether, usado para medir o preço do gas<\/td>\n<\/tr>\n<tr>\n<td>Segunda camada<\/td>\n<td>Rede que processa transferências fora da Ethereum e registra um resumo nela<\/td>\n<\/tr>\n<tr>\n<td>Lamport<\/td>\n<td>A menor parte de um SOL<\/td>\n<\/tr>\n<tr>\n<td>Stablecoin<\/td>\n<td>Token que tenta valer o mesmo que uma moeda tradicional<\/td>\n<\/tr>\n<tr>\n<td>Paridade<\/td>\n<td>Quando a stablecoin vale exatamente a moeda de referência<\/td>\n<\/tr>\n<tr>\n<td>Stablecoin algorítmica<\/td>\n<td>Stablecoin sem reservas, mantida só por regras automáticas<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ethereum.org/pt-br/what-is-ethereum/\">O que é Ethereum?<\/a>: guia oficial, em português.<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ethereum.org/pt-br/developers/docs/gas/\">Gás e taxas do Ethereum<\/a>: como a taxa básica e a gorjeta funcionam.<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://solana.com/docs/tokens\">Tokens na Solana<\/a>: como os tokens são criados na rede (em inglês).<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://solana.com/docs/core/fees\">Taxas na Solana<\/a>: a taxa básica por assinatura (em inglês).<\/li>\n<\/ul>\n<p>Este material é educativo e não é recomendação de investimento.<\/p>"}, "5": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">O preço de uma unidade quase não diz nada: o que importa é o tamanho do projeto, quanto ainda vai entrar no mercado e quanto o mercado aguenta sem o preço saltar. Leia depois dos quatro vídeos do módulo e antes do quiz.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>5.1 Valor de mercado e FDV<\/h3>\n<p>Um token de um centavo não é barato por isso. Com 100 bilhões de unidades, ele vale R$ 1 bilhão. O número que importa é o tamanho do projeto inteiro:<\/p>\n<ul>\n<li><strong>Valor de mercado<\/strong> = preço × unidades em circulação.<\/li>\n<li><strong>FDV (valor totalmente diluído)<\/strong> = preço × total de unidades que vão existir.<\/li>\n<\/ul>\n<p>Muitos projetos guardam unidades para equipe, investidores e caixa, e soltam aos poucos, segundo um cronograma de desbloqueio. Quando o FDV é muito maior que o valor de mercado, muita oferta ainda vai chegar. Se a procura não acompanhar, o preço sofre. No Bitcoin, os dois números ficam próximos, porque a maior parte das unidades já foi criada.<\/p>\n<h3>5.2 Liquidez e volume<\/h3>\n<p>Liquidez é quanto dá para negociar agora sem mexer muito no preço. Volume é quanto foi negociado num período, normalmente 24 horas. Os dois precisam fazer sentido juntos:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Liquidez<\/th>\n<th>Volume<\/th>\n<th>Leitura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Alta<\/td>\n<td>Alto<\/td>\n<td>Mercado saudável<\/td>\n<\/tr>\n<tr>\n<td>Baixa<\/td>\n<td>Alto<\/td>\n<td>Mercado raso: o preço salta com facilidade<\/td>\n<\/tr>\n<tr>\n<td>Alta<\/td>\n<td>Quase zero<\/td>\n<td>Mercado parado<\/td>\n<\/tr>\n<tr>\n<td>Qualquer<\/td>\n<td>Fora de qualquer padrão<\/td>\n<td>Suspeito: pode ser negociação de fachada<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Negociação de fachada é comprar e vender entre carteiras do mesmo dono só para inflar o volume.<\/p>\n<h3>5.3 O livro de ofertas por dentro<\/h3>\n<p>Três leituras vão além do preço:<\/p>\n<ol>\n<li><strong>Spread<\/strong>: diferença entre a melhor venda e a melhor compra. É o custo de entrar e sair na hora.<\/li>\n<li><strong>Profundidade<\/strong>: quanto existe em cada nível de preço. Livro raso acaba rápido.<\/li>\n<li><strong>Deslizamento<\/strong>: uma ordem a mercado grande consome vários níveis, cada um mais caro, e o preço médio piora.<\/li>\n<\/ol>\n<p>A ordem limitada evita o deslizamento: só executa no seu preço ou melhor. Em troca, pode demorar ou não executar.<\/p>\n<h3>5.4 Candles e RSI<\/h3>\n<p>Cada vela resume um período com quatro preços: abertura, fechamento, máxima e mínima. O corpo vai da abertura ao fechamento; os pavios vão à máxima e à mínima. Verde, fechou acima da abertura; vermelho, abaixo. Pavio longo mostra que o preço foi longe e voltou antes do fim do período.<\/p>\n<p>O RSI compara o tamanho das altas e das quedas recentes, quase sempre em 14 períodos, numa escala de 0 a 100. Por convenção, acima de 70 é sobrecomprado e abaixo de 30, sobrevendido. Nenhum dos dois prevê o próximo movimento: em tendências fortes, o RSI fica nos extremos por muito tempo. Indicadores resumem o passado.<\/p>\n<h2>Na prática: duas contas que mudam a leitura<\/h2>\n<p><strong>Diluição.<\/strong> Um token fictício custa R$ 0,50, tem 200 milhões de unidades circulando e 1 bilhão no total.<\/p>\n<ol>\n<li>Valor de mercado: 0,50 × 200 milhões = R$ 100 milhões.<\/li>\n<li>FDV: 0,50 × 1 bilhão = R$ 500 milhões.<\/li>\n<li>Ainda falta entrar: 800 milhões de unidades, ou 80% do total.<\/li>\n<\/ol>\n<p>Para o preço se manter, a procura teria que absorver quatro vezes a oferta de hoje.<\/p>\n<p><strong>Preço médio.<\/strong> No livro abaixo, você compra 6 unidades a mercado.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Oferta de venda<\/th>\n<th>Quantidade<\/th>\n<th>Quanto você leva<\/th>\n<th>Custo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>R$ 100,00<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>R$ 200,00<\/td>\n<\/tr>\n<tr>\n<td>R$ 100,50<\/td>\n<td>3<\/td>\n<td>3<\/td>\n<td>R$ 301,50<\/td>\n<\/tr>\n<tr>\n<td>R$ 101,00<\/td>\n<td>5<\/td>\n<td>1<\/td>\n<td>R$ 101,00<\/td>\n<\/tr>\n<tr>\n<td><strong>Total<\/strong><\/td>\n<td><\/td>\n<td><strong>6<\/strong><\/td>\n<td><strong>R$ 602,50<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>O preço médio fica em 602,50 ÷ 6 = R$ 100,42, ou 0,42% acima do preço que aparecia na tela. Esse é o deslizamento. Com uma ordem limitada a R$ 100,00, você levaria só as 2 primeiras unidades e esperaria pelo resto.<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Valor de mercado<\/td>\n<td>Preço × unidades em circulação<\/td>\n<\/tr>\n<tr>\n<td>FDV<\/td>\n<td>Preço × total de unidades que vão existir<\/td>\n<\/tr>\n<tr>\n<td>Cronograma de desbloqueio<\/td>\n<td>Agenda de liberação das unidades guardadas<\/td>\n<\/tr>\n<tr>\n<td>Liquidez<\/td>\n<td>Quanto dá para negociar sem mexer muito no preço<\/td>\n<\/tr>\n<tr>\n<td>Volume<\/td>\n<td>Quanto foi negociado num período, normalmente 24 horas<\/td>\n<\/tr>\n<tr>\n<td>Negociação de fachada<\/td>\n<td>Compra e venda entre carteiras do mesmo dono para inflar o volume<\/td>\n<\/tr>\n<tr>\n<td>Spread<\/td>\n<td>Diferença entre a melhor oferta de venda e a melhor de compra<\/td>\n<\/tr>\n<tr>\n<td>Profundidade<\/td>\n<td>Quantidade disponível em cada nível de preço<\/td>\n<\/tr>\n<tr>\n<td>Ordem a mercado<\/td>\n<td>Executa na hora, consumindo as ofertas do livro<\/td>\n<\/tr>\n<tr>\n<td>Ordem limitada<\/td>\n<td>Executa só no preço escolhido ou melhor<\/td>\n<\/tr>\n<tr>\n<td>Deslizamento (slippage)<\/td>\n<td>Diferença entre o preço mostrado e o preço médio obtido<\/td>\n<\/tr>\n<tr>\n<td>Candle (vela)<\/td>\n<td>Resumo de um período: abertura, fechamento, máxima e mínima<\/td>\n<\/tr>\n<tr>\n<td>RSI<\/td>\n<td>Índice de 0 a 100 que compara altas e quedas recentes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.coingecko.com/en/methodology\">Metodologia da CoinGecko<\/a>: como um dos maiores sites de dados calcula o valor de mercado (em inglês).<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.gov.br/investidor/pt-br/educacional/publicacoes-educacionais/cvm-comportamental/volume-1-vieses-do-investidor.pdf\">Vieses do Investidor<\/a>: publicação do Portal do Investidor, útil para não ler gráficos com pressa. Volta no módulo 7.<\/li>\n<\/ul>\n<p>Este material é educativo e não é recomendação de investimento.<\/p>"}, "6": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">Em DeFi, contratos fazem o papel da corretora, do banco e da garantia, e cada serviço traz um custo escondido: deslizamento, perda impermanente, liquidação ou prazo de saída. Leia depois dos cinco vídeos do módulo e antes do quiz.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>6.1 A corretora automática<\/h3>\n<p>DeFi são serviços financeiros feitos de contratos inteligentes: trocar, emprestar, render juros, só com a sua carteira e o contrato. Como a blockchain é lenta e cara para um livro de ofertas, a troca usa uma corretora automática, a AMM.<\/p>\n<p>No lugar do livro existe uma piscina com duas moedas. Você coloca uma e tira a outra, e o preço sai de uma regra: x × y = k. A quantidade de uma moeda vezes a da outra continua igual. Quanto mais ether sai da piscina, mais caro ele fica. Arbitradores compram onde está barato e vendem onde está caro, mantendo o preço perto do mercado. Cada troca paga uma taxa, como 0,3%, que fica na piscina.<\/p>\n<h3>6.2 A troca e o deslizamento<\/h3>\n<p>Toda troca mexe no preço: pouco numa piscina grande, muito numa pequena. Entre o clique e a entrada no bloco, outras trocas podem piorar o preço. A tolerância de deslizamento diz quanto você aceita receber a menos; acima disso, a troca é cancelada.<\/p>\n<p>Tolerância alta demais atrai o ataque sanduíche: um robô compra antes de você, piora o seu preço até o limite aceito e vende logo depois. E confira o endereço do contrato do token em fonte oficial: qualquer um cria uma piscina com o nome de um projeto famoso.<\/p>\n<h3>6.3 Piscinas de liquidez e perda impermanente<\/h3>\n<p>Quem deposita as duas moedas na piscina vira provedor de liquidez e ganha uma fatia das taxas. O custo escondido: quando uma moeda sobe em relação à outra, a piscina vende um pouco da que subiu e acumula a que caiu. Na retirada, você tem menos do que teria só guardando. Essa diferença é a perda impermanente.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mudança de preço de uma moeda em relação à outra<\/th>\n<th>Perda impermanente<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1,5 vez<\/td>\n<td>cerca de 2%<\/td>\n<\/tr>\n<tr>\n<td>2 vezes<\/td>\n<td>cerca de 5,7%<\/td>\n<\/tr>\n<tr>\n<td>4 vezes<\/td>\n<td>cerca de 20%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Se o preço voltar ao início, a perda some; se você sair longe dele, ela vira perda de verdade. Prover liquidez só compensa quando as taxas superam essa perda.<\/p>\n<h3>6.4 Empréstimos<\/h3>\n<p>O contrato não sabe quem você é, então pede garantia maior que a dívida. As pessoas pegam emprestado para não vender uma moeda, ter dinheiro sem gerar venda ou alavancar, o que multiplica ganho e perda. Os juros variam com a procura.<\/p>\n<p>Se a garantia cai perto do valor da dívida, o contrato vende parte dela sozinho e cobra multa: é a liquidação. Em quedas rápidas, liquidações em cadeia derrubam o preço ainda mais. A saúde da posição mostra a distância até a liquidação.<\/p>\n<h3>6.5 Staking<\/h3>\n<p>Nas redes de prova de participação, quem valida trava moedas como garantia e recebe recompensa, paga com emissão nova e taxas. Rodar um validador exige equipamento e, na Ethereum, 32 ether; o comum é delegar. Os riscos estão em quatro lugares:<\/p>\n<ol>\n<li><strong>Preço<\/strong>: a recompensa vem na própria moeda e pode não compensar uma queda.<\/li>\n<li><strong>Prazo<\/strong>: desfazer o staking pode levar dias ou semanas.<\/li>\n<li><strong>Punição (slashing)<\/strong>: validador que erra perde moedas, e quem delegou pode ser atingido.<\/li>\n<li><strong>Plataforma<\/strong>: corretora ou contrato trazem de volta o risco de terceiros e de código.<\/li>\n<\/ol>\n<p>O staking líquido dá um token que representa as moedas travadas. É mais flexível e soma mais uma camada de risco.<\/p>\n<h2>Na prática: duas contas de DeFi<\/h2>\n<p><strong>Impacto no preço.<\/strong> Você compra 1 ether em duas piscinas com o mesmo preço inicial de US$ 2.000. Valores sem a taxa de 0,3%.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Piscina<\/th>\n<th>Antes<\/th>\n<th>Depois de tirar 1 ether<\/th>\n<th>Você paga<\/th>\n<th>Acima do preço inicial<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pequena<\/td>\n<td>10 ETH e US$ 20.000 (k = 200.000)<\/td>\n<td>9 ETH e US$ 22.222<\/td>\n<td>US$ 2.222<\/td>\n<td>11%<\/td>\n<\/tr>\n<tr>\n<td>Grande<\/td>\n<td>1.000 ETH e US$ 2.000.000<\/td>\n<td>999 ETH e US$ 2.002.002<\/td>\n<td>US$ 2.002<\/td>\n<td>0,1%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A conta é a mesma nas duas: k ÷ ether que sobra = dólares que a piscina precisa ter. A diferença para o que havia antes é o que você paga.<\/p>\n<p><strong>Preço de liquidação.<\/strong> Você deposita US$ 1.000 em ether e pega US$ 700 emprestados. Num contrato hipotético com limite de liquidação de 80%:<\/p>\n<ol>\n<li>A posição é liquidada quando garantia × 0,80 fica abaixo da dívida.<\/li>\n<li>Garantia mínima: 700 ÷ 0,80 = US$ 875.<\/li>\n<li>Queda que dispara a liquidação: de 1.000 para 875, ou 12,5%.<\/li>\n<\/ol>\n<p>Uma queda de 12,5% em ether acontece com frequência. Pegar menos emprestado afasta esse ponto: com US$ 400 de dívida, a garantia mínima cai para US$ 500, e a queda tolerada sobe para 50%.<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>DeFi<\/td>\n<td>Finanças descentralizadas: serviços financeiros feitos de contratos<\/td>\n<\/tr>\n<tr>\n<td>AMM<\/td>\n<td>Corretora automática que troca moedas com uma piscina e uma fórmula<\/td>\n<\/tr>\n<tr>\n<td>x × y = k<\/td>\n<td>Regra do produto constante que define o preço na piscina<\/td>\n<\/tr>\n<tr>\n<td>Arbitrador<\/td>\n<td>Quem compra onde está barato e vende onde está caro<\/td>\n<\/tr>\n<tr>\n<td>Impacto no preço<\/td>\n<td>Quanto a sua troca muda o preço da piscina<\/td>\n<\/tr>\n<tr>\n<td>Tolerância de deslizamento<\/td>\n<td>Quanto você aceita receber a menos antes de a troca ser cancelada<\/td>\n<\/tr>\n<tr>\n<td>Ataque sanduíche<\/td>\n<td>Robô que compra antes e vende depois da sua troca<\/td>\n<\/tr>\n<tr>\n<td>Provedor de liquidez<\/td>\n<td>Quem deposita as duas moedas na piscina e ganha taxas<\/td>\n<\/tr>\n<tr>\n<td>Perda impermanente<\/td>\n<td>Diferença entre ficar na piscina e só guardar as moedas<\/td>\n<\/tr>\n<tr>\n<td>Garantia<\/td>\n<td>Valor depositado para pegar um empréstimo<\/td>\n<\/tr>\n<tr>\n<td>Liquidação<\/td>\n<td>Venda automática da garantia quando ela cai demais<\/td>\n<\/tr>\n<tr>\n<td>Alavancagem<\/td>\n<td>Operar com dinheiro emprestado, multiplicando ganho e perda<\/td>\n<\/tr>\n<tr>\n<td>Staking<\/td>\n<td>Travar moedas para validar a rede em troca de recompensa<\/td>\n<\/tr>\n<tr>\n<td>Slashing<\/td>\n<td>Corte das moedas de um validador que erra<\/td>\n<\/tr>\n<tr>\n<td>Staking líquido<\/td>\n<td>Staking que dá um token negociável representando as moedas travadas<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.uniswap.org/contracts/v2/concepts/protocol-overview/how-uniswap-works\">How Uniswap works<\/a>: a fórmula x × y = k explicada pela própria Uniswap (em inglês).<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ethereum.org/pt-br/staking/\">Staking no Ethereum<\/a>: como funciona, recompensas e riscos, em português.<\/li>\n<\/ul>\n<p>Este material é educativo e não é recomendação de investimento. Em DeFi, uma falha de contrato pode levar todo o valor depositado.<\/p>"}, "7": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">O tamanho da posição importa mais do que a moeda escolhida: ele sai de quanto você aceita perder, decidido antes de entrar e por escrito. Leia depois dos quatro vídeos do módulo e antes do quiz.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>7.1 O tamanho da posição<\/h3>\n<p>Antes de qualquer gráfico, vêm as contas do mês e uma reserva de emergência em algo seguro e fácil de sacar. Em cripto entra só o que você pode perder sem mudar a sua vida.<\/p>\n<p>Dentro desse dinheiro, uma regra comum é limitar a perda de cada operação a 1% ou 2% do total. Não é colocar 1% do dinheiro; é aceitar perder no máximo 1% se der errado. O tamanho da posição sai da fórmula:<\/p>\n<div class=\"formula\">posição = valor que você aceita perder ÷ distância até o ponto de saída<\/div>\n\n<p>Perdas grandes são difíceis de recuperar: quem perde 50% precisa ganhar 100% para voltar ao início.<\/p>\n<h3>7.2 O ponto de saída e o alvo<\/h3>\n<p>O stop é o preço em que você reconhece o erro e sai, definido antes de entrar. Depois que o preço cai, a cabeça sempre acha um motivo para esperar. O alvo é o preço em que você pretende realizar o lucro.<\/p>\n<p>A relação risco e retorno compara os dois e muda quantas vezes você precisa acertar:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Relação risco e retorno<\/th>\n<th>Acerto mínimo para empatar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 para 1<\/td>\n<td>50%<\/td>\n<\/tr>\n<tr>\n<td>1 para 2<\/td>\n<td>33%<\/td>\n<\/tr>\n<tr>\n<td>1 para 3<\/td>\n<td>25%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>O stop não garante o preço: numa queda rápida, a ordem pode sair bem abaixo, pelo deslizamento do módulo 5. E stop perto demais sai em qualquer oscilação normal. Moedas mais voláteis pedem stop mais distante e, pela fórmula, posição menor.<\/p>\n<h3>7.3 Diversificação<\/h3>\n<p>Em cripto, as moedas andam juntas. Quando o bitcoin cai forte, a maioria cai junto, muitas vezes mais. Essa correlação aumenta justamente no pânico. Por isso a diversificação mais importante é no patrimônio todo: se a parte em cripto cair 70%, como fica a sua vida?<\/p>\n<p>Dentro da cripto, dá para diversificar de três jeitos:<\/p>\n<ul>\n<li><strong>Por tipo de risco<\/strong>: moedas grandes e antigas oscilam menos que tokens novos, que podem ir a zero.<\/li>\n<li><strong>No tempo<\/strong>: comprar aos poucos, em datas fixas, reduz o peso de entrar no pior momento.<\/li>\n<li><strong>Na custódia<\/strong>: não deixar tudo numa corretora, numa carteira ou num contrato.<\/li>\n<\/ul>\n<h3>7.4 Vieses e FOMO<\/h3>\n<p>Quem perde dinheiro em cripto quase sempre sabia, na teoria, o que fazer. O que falha é a cabeça na hora:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Viés<\/th>\n<th>Como aparece<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>FOMO<\/td>\n<td>Comprar no topo depois que todo mundo já comenta a alta<\/td>\n<\/tr>\n<tr>\n<td>Aversão à perda<\/td>\n<td>Segurar a perdedora esperando voltar ao preço de compra<\/td>\n<\/tr>\n<tr>\n<td>Ancoragem<\/td>\n<td>\"Já valeu R$ 10, então a R$ 1 está barato\"<\/td>\n<\/tr>\n<tr>\n<td>Viés de confirmação<\/td>\n<td>Ler só o que concorda com a decisão já tomada<\/td>\n<\/tr>\n<tr>\n<td>Efeito manada<\/td>\n<td>Fazer o que a maioria faz porque parece seguro<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A defesa é decidir antes, com calma: plano escrito com motivo, tamanho, stop e alvo, e um diário de decisões para aprender com os próprios erros.<\/p>\n<h2>Na prática: o plano de uma operação<\/h2>\n<p>Com R$ 10.000 separados para cripto e risco de 1% por operação, a posição neste exemplo fica em R$ 1.000. Token fictício, preços ilustrativos.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Item do plano<\/th>\n<th>Valor<\/th>\n<th>Conta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Perda aceita<\/td>\n<td>R$ 100<\/td>\n<td>1% de R$ 10.000<\/td>\n<\/tr>\n<tr>\n<td>Entrada<\/td>\n<td>R$ 50,00<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Stop<\/td>\n<td>R$ 45,00<\/td>\n<td>10% abaixo da entrada<\/td>\n<\/tr>\n<tr>\n<td>Tamanho da posição<\/td>\n<td>R$ 1.000 (20 unidades)<\/td>\n<td>R$ 100 ÷ 10%<\/td>\n<\/tr>\n<tr>\n<td>Alvo<\/td>\n<td>R$ 60,00<\/td>\n<td>20% acima da entrada<\/td>\n<\/tr>\n<tr>\n<td>Ganho esperado no alvo<\/td>\n<td>R$ 200<\/td>\n<td>20 × R$ 10<\/td>\n<\/tr>\n<tr>\n<td>Relação risco e retorno<\/td>\n<td>1 para 2<\/td>\n<td>R$ 100 contra R$ 200<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Agora o cenário ruim: o preço abre de madrugada em R$ 43 e o stop executa ali. A perda fica em 20 × R$ 7 = R$ 140, ou 1,4% do total. Doeu, mas o plano aguentou, porque a posição foi calculada antes.<\/p>\n<p>Antes de entrar, escreva no diário: por que esta operação, o tamanho, o stop, o alvo e o que faria você desistir dela.<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Reserva de emergência<\/td>\n<td>Dinheiro seguro e fácil de sacar para imprevistos<\/td>\n<\/tr>\n<tr>\n<td>Posição<\/td>\n<td>Quanto dinheiro está numa operação<\/td>\n<\/tr>\n<tr>\n<td>Risco por operação<\/td>\n<td>Quanto do total você aceita perder se a operação der errado<\/td>\n<\/tr>\n<tr>\n<td>Stop<\/td>\n<td>Preço de saída definido antes de entrar, para limitar a perda<\/td>\n<\/tr>\n<tr>\n<td>Alvo<\/td>\n<td>Preço em que você pretende realizar o lucro<\/td>\n<\/tr>\n<tr>\n<td>Relação risco e retorno<\/td>\n<td>Quanto você arrisca comparado com quanto espera ganhar<\/td>\n<\/tr>\n<tr>\n<td>Volatilidade<\/td>\n<td>O quanto um preço costuma oscilar<\/td>\n<\/tr>\n<tr>\n<td>Correlação<\/td>\n<td>Quanto dois ativos andam juntos<\/td>\n<\/tr>\n<tr>\n<td>Diversificação<\/td>\n<td>Dividir o risco entre ativos, tempos e lugares diferentes<\/td>\n<\/tr>\n<tr>\n<td>FOMO<\/td>\n<td>Medo de ficar de fora, que leva a comprar no topo<\/td>\n<\/tr>\n<tr>\n<td>Aversão à perda<\/td>\n<td>Perder dói mais do que ganhar a mesma quantia dá prazer<\/td>\n<\/tr>\n<tr>\n<td>Ancoragem<\/td>\n<td>Ficar preso a um preço passado<\/td>\n<\/tr>\n<tr>\n<td>Diário de decisões<\/td>\n<td>Registro escrito do plano e do resultado de cada operação<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.gov.br/investidor/pt-br/educacional/publicacoes-educacionais/cvm-comportamental/volume-1-vieses-do-investidor.pdf\">Vieses do Investidor<\/a>: publicação do Portal do Investidor sobre os vieses que atrapalham as decisões.<\/li>\n<\/ul>\n<p>Este material é educativo e não é recomendação de investimento. Criptomoedas oscilam muito, e você pode perder dinheiro.<\/p>"}, "8": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">Ter cripto não gera imposto, mas precisa ser declarado; o imposto incide sobre o lucro na venda, com isenção para vendas de até R$ 35 mil por mês em corretora brasileira. Leia depois dos quatro vídeos do módulo e antes do quiz. Este texto descreve as regras gerais em vigor em outubro de 2026 e não é consultoria tributária: na dúvida, procure um contador.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>8.1 Declarar cripto no imposto de renda<\/h3>\n<p>Cripto entra na ficha de Bens e Direitos, no grupo 08, de criptoativos. Cada tipo tem um código:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Código<\/th>\n<th>Tipo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>01<\/td>\n<td>Bitcoin<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td>Outras criptomoedas<\/td>\n<\/tr>\n<tr>\n<td>03<\/td>\n<td>Stablecoins<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>NFTs<\/td>\n<\/tr>\n<tr>\n<td>99<\/td>\n<td>Outros criptoativos<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A declaração é obrigatória quando o custo de aquisição de cada tipo chega a R$ 5.000. O valor informado é o custo, não o preço de mercado no fim do ano: comprou por R$ 1.000 e hoje vale R$ 3.000, declara R$ 1.000. Na descrição, informe quantidade, ativo e onde está guardado: nome e CNPJ da corretora, ou carteira própria. Guarde notas, extratos e registros de cada operação.<\/p>\n<h3>8.2 Quando a venda paga imposto<\/h3>\n<p>O imposto incide sobre o ganho de capital: valor da venda menos custo de aquisição. Em corretora brasileira, vale a isenção mensal:<\/p>\n<ul>\n<li>Se o total vendido no mês, somando todas as criptos, ficar em até R$ 35.000, o lucro do mês é isento.<\/li>\n<li>O limite olha o total vendido, não o lucro. Passou de R$ 35.000, todo o lucro do mês é tributável.<\/li>\n<li>Trocar uma cripto por outra conta como venda, mesmo sem passar pelo real.<\/li>\n<\/ul>\n<p>Acima do limite, a alíquota é de 15% para ganhos de até R$ 5 milhões, subindo em faixas até 22,5%. O imposto é pago por DARF, código 4600, até o último dia útil do mês seguinte à venda.<\/p>\n<p>Em corretoras sediadas fora do Brasil, a regra é outra desde 2024, pela Lei 14.754/2023: apuração anual, na declaração, com 15% e sem a isenção de R$ 35.000. A medida provisória de 2025 que tentava mudar essas regras perdeu a validade em outubro de 2025.<\/p>\n<h3>8.3 O que a Receita fica sabendo<\/h3>\n<p>Desde 2019, as corretoras brasileiras informam as operações dos clientes todo mês. Em 2026, o acompanhamento passou para a DeCripto, criada pela Instrução Normativa RFB 2.291/2025, que segue um padrão internacional de troca de informações. Corretoras estrangeiras que atuam no Brasil também passam a informar.<\/p>\n<p>Quem opera sem corretora brasileira no meio (corretora estrangeira, pessoa para pessoa, carteira própria) pode ter que informar por conta própria, quando o total do mês passa do limite da regra: R$ 35.000 desde julho de 2026. O prazo é o último dia útil do mês seguinte, e o atraso gera multa. Informar não substitui a declaração anual nem o DARF.<\/p>\n<h3>8.4 O marco legal e os reguladores<\/h3>\n<p>A Lei 14.478, de dezembro de 2022, em vigor desde junho de 2023, definiu ativo virtual e as regras para as empresas que prestam serviços com eles. O Decreto 11.563/2023 escolheu o Banco Central como regulador. As regras do Banco Central saíram em novembro de 2025 e entraram em vigor em fevereiro de 2026: autorização, capital, proteção de clientes e câmbio.<\/p>\n<p>A CVM entra quando um token funciona como investimento coletivo, com promessa de participação nos resultados: aí ele pode ser valor mobiliário. A lei também criou o crime de fraude com ativos virtuais, com pena de 4 a 8 anos. Na prática: confira se a empresa está autorizada ou em processo de autorização no Banco Central e desconfie de retorno garantido sem registro na CVM.<\/p>\n<h2>Na prática: três meses de apuração<\/h2>\n<p>Neste exemplo, só abril e maio pagam imposto: R$ 300 e R$ 900. Todas as operações são em corretora brasileira e os valores são ilustrativos.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mês<\/th>\n<th>Operações<\/th>\n<th>Total vendido<\/th>\n<th>Lucro<\/th>\n<th>Isento?<\/th>\n<th>Imposto (15%)<\/th>\n<th>DARF 4600 até<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Março<\/td>\n<td>Venda de bitcoin<\/td>\n<td>R$ 20.000<\/td>\n<td>R$ 3.000<\/td>\n<td>Sim<\/td>\n<td>R$ 0<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Abril<\/td>\n<td>Venda de ether<\/td>\n<td>R$ 40.000<\/td>\n<td>R$ 2.000<\/td>\n<td>Não<\/td>\n<td>R$ 300<\/td>\n<td>Último dia útil de maio<\/td>\n<\/tr>\n<tr>\n<td>Maio<\/td>\n<td>Troca de bitcoin por ether (R$ 30.000) + venda de SOL (R$ 10.000)<\/td>\n<td>R$ 40.000<\/td>\n<td>R$ 6.000<\/td>\n<td>Não<\/td>\n<td>R$ 900<\/td>\n<td>Último dia útil de junho<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Dois pontos pegam muita gente. Em abril, o lucro foi pequeno, mas o total vendido passou de R$ 35.000, então todo o lucro paga. Em maio, a troca de bitcoin por ether entrou no total vendido, mesmo sem nenhum real envolvido.<\/p>\n<p>No fim do ano, cada cripto que você ainda tem vai para a ficha de Bens e Direitos pelo custo de aquisição.<\/p>\n<h2>Glossário<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Termo<\/th>\n<th>O que significa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bens e Direitos<\/td>\n<td>Ficha da declaração anual onde se informa o que você tem<\/td>\n<\/tr>\n<tr>\n<td>Grupo 08<\/td>\n<td>Grupo de criptoativos dentro de Bens e Direitos<\/td>\n<\/tr>\n<tr>\n<td>Custo de aquisição<\/td>\n<td>Quanto você pagou pelo ativo, incluindo taxas<\/td>\n<\/tr>\n<tr>\n<td>Ganho de capital<\/td>\n<td>Valor da venda menos o custo de aquisição<\/td>\n<\/tr>\n<tr>\n<td>Isenção de R$ 35 mil<\/td>\n<td>Lucro isento quando o total vendido no mês fica até esse valor, em corretora brasileira<\/td>\n<\/tr>\n<tr>\n<td>DARF<\/td>\n<td>Guia de pagamento de tributos federais<\/td>\n<\/tr>\n<tr>\n<td>Código 4600<\/td>\n<td>Código do DARF para ganho de capital com criptoativos<\/td>\n<\/tr>\n<tr>\n<td>Apuração mensal<\/td>\n<td>Cálculo do lucro e do imposto mês a mês<\/td>\n<\/tr>\n<tr>\n<td>DeCripto<\/td>\n<td>Sistema da Receita para informações sobre operações com cripto, desde 2026<\/td>\n<\/tr>\n<tr>\n<td>Marco legal<\/td>\n<td>Lei 14.478/2022, que regula as prestadoras de serviços de ativos virtuais<\/td>\n<\/tr>\n<tr>\n<td>Valor mobiliário<\/td>\n<td>Investimento coletivo sob regras da CVM<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Para ir além<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/declaracoes-e-demonstrativos/criptoativos\">Criptoativos — Receita Federal<\/a>: página oficial com os atos da DeCripto e da IN 1.888/2019.<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/l14478.htm\">Lei 14.478/2022<\/a>: o marco legal dos criptoativos.<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/decreto/D11563.htm\">Decreto 11.563/2023<\/a>: define o Banco Central como regulador.<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14754.htm\">Lei 14.754/2023<\/a>: tributação de aplicações no exterior, incluindo ativos virtuais.<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://conteudo.cvm.gov.br/legislacao/pareceres-orientacao/pare040.html\">Parecer de Orientação CVM 40<\/a>: quando um criptoativo pode ser valor mobiliário.<\/li>\n<\/ul>\n<p>As regras tributárias mudam. Confira sempre as páginas oficiais e, na dúvida, procure um contador.<\/p>"}, "9": {"titulo": "Leitura complementar", "html": "<p class=\"lead\">Na liquidez concentrada, o dinheiro trabalha só na faixa de preço que você escolhe: rende mais taxas enquanto o preço está nela e exige regras de saída definidas antes de abrir. Leia depois dos quatro vídeos do módulo e antes do quiz.<\/p>\n<h2>Aula por aula<\/h2>\n<h3>9.1 Bins e preço<\/h3>\n<p>A piscina clássica do módulo 6 espalha a liquidez por todos os preços, e a maior parte fica parada. Na liquidez concentrada, você escolhe a faixa. Na Solana, uma das formas mais usadas é a DLMM, da Meteora, que divide a faixa em degraus de preço fixo, os bins.<\/p>\n<p>Dentro de um bin, as trocas acontecem exatamente naquele preço. Quando a liquidez dele acaba, a troca passa ao vizinho. A distância entre bins é o bin step, em pontos-base (1 ponto-base = 0,01%). Bin step 10 = 0,1% por degrau; bin step 100 = 1%.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Onde está o bin<\/th>\n<th>O que ele guarda<\/th>\n<th>O que acontece quando o preço passa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Abaixo do preço atual<\/td>\n<td>Moeda de cotação (SOL ou dólar digital)<\/td>\n<td>Compra o token, degrau por degrau, na queda<\/td>\n<\/tr>\n<tr>\n<td>No preço atual (bin ativo)<\/td>\n<td>As duas moedas<\/td>\n<td>Recebe as trocas e as taxas<\/td>\n<\/tr>\n<tr>\n<td>Acima do preço atual<\/td>\n<td>O token<\/td>\n<td>Vende o token, degrau por degrau, na alta<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Se o preço sai da faixa, você fica com uma moeda só e para de ganhar taxas. Bin step pequeno serve para pares estáveis; grande, para tokens muito voláteis.<\/p>\n<h3>9.2 Spot, Curve e Bid-Ask<\/h3>\n<p>Três decisões definem a posição: formato, lado e largura.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Formato<\/th>\n<th>Distribuição<\/th>\n<th>Combina com<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Spot<\/td>\n<td>Igual em todos os bins<\/td>\n<td>Quase qualquer mercado; pede menos ajustes<\/td>\n<\/tr>\n<tr>\n<td>Curve<\/td>\n<td>Concentrada no meio<\/td>\n<td>Pares estáveis e mercados calmos; se o preço andar, sai rápido da faixa<\/td>\n<\/tr>\n<tr>\n<td>Bid-Ask<\/td>\n<td>Carregada nas pontas<\/td>\n<td>Movimentos fortes; o mais arriscado (numa queda forte, acumula o token que cai) e o que mais pede ajustes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>No lado: dois lados põem a faixa em volta do preço; um lado só abaixo do preço funciona como compra aos poucos numa queda, e acima, como venda aos poucos numa alta. Na largura: faixa larga rende menos por real e sai menos vezes; faixa estreita rende mais e exige acompanhamento quase diário.<\/p>\n<h3>9.3 As taxas e a relação com a liquidez<\/h3>\n<p>A taxa de cada troca vai para quem tem liquidez nos bins atravessados. Ela tem duas partes:<\/p>\n<ul>\n<li><strong>Taxa base<\/strong>: fixa, definida na criação da piscina, maior em bin steps maiores.<\/li>\n<li><strong>Taxa variável<\/strong>: sobe quando muitas trocas atravessam muitos bins em pouco tempo, e cai quando o mercado acalma.<\/li>\n<\/ul>\n<p>Uma pequena parte fica com o protocolo; o resto vai aos provedores de cada bin, na proporção do depósito. Para comparar piscinas, use taxas do período ÷ TVL. Relação muito alta costuma vir de tokens novos e voláteis, e o número é uma foto do passado: olhe vários dias, junto com volume e liquidez.<\/p>\n<h3>9.4 Quando fechar<\/h3>\n<p>O resultado tem três partes: taxas recebidas, variação de preço das moedas e perda pelo reequilíbrio, que na liquidez concentrada pode ser maior que no módulo 6.<\/p>\n<p>Defina as regras de saída antes de abrir: preço fora da faixa por um tempo, queda combinada do token ou alvo de taxas. Sair da faixa por baixo é o caso mais perigoso: você fica só com o token que está caindo. Rebalancear custa taxas de rede e torna real a perda do momento. Volume e preço caindo juntos costumam indicar a hora de sair. Anote cada posição: data, faixa, formato, entrada, taxas e saída.<\/p>\n<h2>Na prática: três contas de DLMM<\/h2>\n<p><strong>Largura da faixa.<\/strong> Com o preço em 100 e 20 bins acima dele, a faixa vai até 100 × (1 + bin step)^20:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Bin step<\/th>\n<th>Cada degrau<\/th>\n<th>Topo da faixa com 20 bins<\/th>\n<th>Cobertura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>10<\/td>\n<td>0,1%<\/td>\n<td>102,0<\/td>\n<td>cerca de 2%<\/td>\n<\/tr>\n<tr>\n<td>50<\/td>\n<td>0,5%<\/td>\n<td>110,5<\/td>\n<td>cerca de 10,5%<\/td>\n<\/tr>\n<tr>\n<td>100<\/td>\n<td>1%<\/td>\n<td>122,0<\/td>\n<td>cerca de 22%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Os mesmos 20 degraus cobrem uma faixa dez vezes maior com bin step 100. Por isso tokens voláteis pedem bin step grande.<\/p>\n<p><strong>Taxas ÷ TVL.<\/strong> Uma piscina com US$ 1.000.000 depositados gerou US$ 20.000 de taxas em 24 horas: 20.000 ÷ 1.000.000 = 2% no dia. Se isso se repetisse por um ano, daria mais de 700%, o que é um sinal de risco, não de oportunidade.<\/p>\n<p><strong>Resultado de uma posição.<\/strong> Você depositou US$ 1.000 e fechou após uma queda do token. Val
